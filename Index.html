
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>הצדף | חלוקת טיפים</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Assistant:wght@400;600;700;800;900&family=Heebo:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef3f8;
  --ink:#172033;
  --ink-2:#364255;
  --muted:#6b778a;
  --line:#d9e1ec;
  --line-strong:#c5d0de;
  --brand:#153a63;
  --brand-2:#0f2743;
  --accent:#2563eb;
  --accent-2:#1d4ed8;
  --accent-soft:#eaf2ff;
  --ok:#0f766e;
  --ok-soft:#e8f7f4;
  --warn:#b45309;
  --warn-soft:#fff4df;
  --err:#b91c1c;
  --err-soft:#fff1f1;
  --gold:#b99552;
  --shadow:0 18px 50px rgba(15,23,42,.10);
  --shadow-soft:0 7px 20px rgba(15,23,42,.07);
  --radius:16px;
  --radius-sm:11px;
  --touch:46px;
  --max:1180px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100%;
  margin:0 auto;
  max-width:var(--max);
  padding:0 16px calc(92px + env(safe-area-inset-bottom));
  color:var(--ink);
  background:
    radial-gradient(circle at 8% -8%,rgba(37,99,235,.13),transparent 30%),
    linear-gradient(180deg,#f9fbfd 0,#f3f6f9 42%,#edf2f7 100%);
  font:500 15px/1.42 "Assistant","Heebo",Arial,system-ui,sans-serif;
  direction:rtl;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.danger-text{color:var(--err)}
.ok-text{color:var(--ok)}
.warn-text{color:var(--warn)}
.app-shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:18px;align-items:start}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  margin:0 -16px 18px;
  padding:14px 16px;
  background:rgba(244,246,249,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(217,225,236,.86);
}
.shell-bar{
  max-width:var(--max);
  margin:0 auto;
  display:grid;
  grid-template-columns:248px minmax(0,1fr);
  gap:18px;
  align-items:center;
}
.brand-block{
  min-height:64px;
  border-radius:18px;
  padding:12px 14px;
  color:#fff;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  box-shadow:0 16px 38px rgba(21,58,99,.18);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand-title{font-size:1.26rem;font-weight:950;letter-spacing:-.02em}
.brand-subtitle{font-size:.8rem;color:#bad0ea;font-weight:850;margin-top:2px}
.brand-mark{
  inline-size:38px;block-size:38px;border-radius:12px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  font-weight:950;color:#fff;
}
.top-workspace{
  min-height:64px;
  border-radius:18px;
  padding:10px 12px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(217,225,236,.92);
  box-shadow:var(--shadow-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.workspace-title{font-size:1.02rem;font-weight:950;color:var(--ink)}
.workspace-subtitle{font-size:.82rem;color:var(--muted);font-weight:750}
.cloud-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0}
.cloud-pill,.pill{
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--ink-2);
  font-size:.82rem;
  font-weight:850;
}
.cloud-pill.ok,.pill.ok{background:var(--ok-soft);border-color:#b9e3d9;color:var(--ok)}
.cloud-pill.err,.pill.err{background:var(--err-soft);border-color:#f2baba;color:var(--err)}
.sync-now-btn{min-height:32px!important;border-radius:999px!important;padding:0 12px!important}
.side-nav{
  position:sticky;
  top:100px;
  border-radius:22px;
  padding:12px;
  background:linear-gradient(180deg,#101b2e,#142744);
  color:#fff;
  box-shadow:0 24px 60px rgba(15,23,42,.18);
}
.nav-kicker{font-size:.75rem;color:#91a8c7;font-weight:900;padding:6px 8px 10px}
.tabs{
  display:grid;
  gap:7px;
  background:transparent;
  border:0;
  padding:0;
}
.tab-btn{
  min-height:48px;
  border:1px solid transparent;
  border-radius:14px;
  padding:0 12px;
  background:transparent;
  color:#d9e5f5;
  text-align:right;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:background .16s ease,border-color .16s ease,transform .16s ease,color .16s ease;
}
.tab-btn::after{content:"";inline-size:7px;block-size:7px;border-radius:999px;background:transparent}
.tab-btn:hover{background:rgba(255,255,255,.07)}
.tab-btn.active{
  color:#0d1728;
  background:#fff;
  border-color:rgba(255,255,255,.24);
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}
.tab-btn.active::after{background:var(--accent)}
.icon{display:none!important}
.nav-note{
  margin-top:12px;
  padding:12px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#cbd9ec;
  font-size:.82rem;
  font-weight:750;
}
main{min-width:0}
.view{display:none}
.view.active{display:block;animation:fadeIn .18s ease both}
@keyframes fadeIn{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:14px;align-items:start}
.stack{display:grid;gap:12px}
.card{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(217,225,236,.98);
  border-radius:var(--radius);
  padding:14px;
  margin:0 0 12px;
  box-shadow:var(--shadow-soft);
}
.card.critical{
  border-color:#c8d7ea;
  box-shadow:0 18px 48px rgba(15,23,42,.10);
}
.section-head,.panel-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin:-14px -14px 14px;
  padding:13px 14px;
  border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,#fbfdff,#eef5ff);
  border-bottom:1px solid var(--line);
}
h1,h2,h3,p{margin:0}
h2{font-size:1.03rem;font-weight:950;color:var(--ink);letter-spacing:-.01em}
h3{font-size:.94rem;font-weight:950;color:var(--ink)}
.section-copy{font-size:.82rem;color:var(--muted);font-weight:750;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.report-meta-grid{grid-template-columns:1fr 1fr}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.tight-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;color:#334155;font-weight:850;font-size:.84rem;margin:0 0 5px}
input[type="text"],input[type="number"],input[type="date"],input[type="month"],select,textarea{
  width:100%;
  min-height:var(--touch);
  border:1px solid #cbd7e4;
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  padding:8px 11px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
textarea{min-height:112px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(37,99,235,.15);
}
input[type="checkbox"],input[type="radio"]{inline-size:1.05rem;block-size:1.05rem;accent-color:var(--accent);vertical-align:middle}
.field-hint{margin-top:5px;color:var(--muted);font-size:.78rem;font-weight:750}
.btn{
  min-height:42px;
  border:0;
  border-radius:12px;
  padding:0 14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-weight:950;
  box-shadow:0 10px 20px rgba(37,99,235,.16);
  transition:transform .14s ease,filter .14s ease,box-shadow .14s ease;
}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(1px)}
.btn.secondary{
  color:var(--brand);
  background:#fff;
  border:1px solid #b9c7d8;
  box-shadow:none;
}
.btn.ghost{
  background:transparent;
  color:var(--muted);
  border:1px solid var(--line);
  box-shadow:none;
}
.btn.danger{
  color:var(--err);
  background:var(--err-soft);
  border:1px solid #f2baba;
  box-shadow:none;
}
.btn.small{min-height:34px;padding:0 11px;border-radius:10px;font-size:.83rem}
.btn.icon{inline-size:34px;min-inline-size:34px;min-height:34px;padding:0;display:inline-grid;place-items:center}
.shift-toggle{
  min-height:var(--touch);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  background:var(--surface-3);
  border:1px solid var(--line);
  border-radius:13px;
}
.shift-choice{
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-weight:950;
}
.shift-choice.active{background:#fff;color:var(--brand);box-shadow:0 5px 13px rgba(15,23,42,.09)}
.decision-strip{
  display:grid;
  gap:9px;
  margin-top:12px;
}
.status-strip{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.status-chip{
  display:inline-flex;align-items:center;gap:7px;
  min-height:30px;padding:5px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink-2);
  font-weight:900;
  font-size:.81rem;
}
.status-chip.ok{background:var(--ok-soft);border-color:#b9e3d9;color:var(--ok)}
.status-chip.warn{background:var(--warn-soft);border-color:#f2d198;color:var(--warn)}
.status-chip.err{background:var(--err-soft);border-color:#f2baba;color:var(--err)}
#shiftExistsChip:empty{display:none}
.report-actions{display:flex;justify-content:flex-start}
.utility-link{
  min-height:34px!important;
  border-radius:999px!important;
  color:var(--muted)!important;
  background:transparent!important;
  border:1px dashed var(--line-strong)!important;
  box-shadow:none!important;
}
.existing-shift-box{
  display:none;
  padding:12px;
  border-radius:14px;
  background:var(--warn-soft);
  border:1px solid #f2d198;
}
.existing-shift-box.show{display:block}
.existing-shift-box b{display:block;margin-bottom:4px;color:#744400}
.department-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.department-panel{
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  overflow:hidden;
}
.department-panel.tip-role{border-color:#bfd0e8}
.department-panel.report-only-role{background:#fbfcfe}
.department-title{
  min-height:48px;
  padding:10px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid var(--line);
  background:var(--surface-2);
}
.department-title h3{font-size:.92rem}
.collapse-body{padding:10px}
.collapse-body.collapsed{display:none}
.add-worker-btn{width:100%;margin-top:8px}
.worker-card,.employee-card,.day-card,.summary-card,.alert-card,.result-card{
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  padding:10px;
  margin:8px 0;
  box-shadow:0 2px 7px rgba(15,23,42,.035);
}
.worker-head,.employee-head,.day-head,.summary-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}
.worker-title,.employee-title,.day-title,.summary-title,.result-card .name{
  font-weight:950;color:var(--ink);overflow-wrap:anywhere;
}
.employee-sub,.worker-sub,.day-sub,.summary-sub{font-size:.82rem;color:var(--muted);font-weight:750}
.worker-actions,.employee-actions,.day-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
.stars-wrap{padding:10px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.stars-options{display:none;gap:7px;flex-wrap:wrap;margin-top:8px}
.radio-chip{
  display:inline-flex;align-items:center;gap:6px;
  min-height:34px;padding:0 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-weight:900;
}
.radio-chip:has(input:checked){background:var(--accent-soft);border-color:#bcd1ff;color:var(--accent-2)}
.switch-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
.switch-label,.toggle-label{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:850;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.kpi{
  min-width:0;
  padding:10px;
  border-radius:14px;
  background:var(--surface-2);
  border:1px solid var(--line);
}
.kpi span{display:block;color:var(--muted);font-size:.77rem;font-weight:850}
.kpi b{display:block;margin-top:3px;color:var(--ink);font-size:1.12rem;font-weight:950;overflow-wrap:anywhere}
.hero-kpi{
  grid-column:span 2;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  border-color:var(--brand);
}
.hero-kpi span{color:#bdd0e8}
.hero-kpi b{color:#fff;font-size:1.42rem}
.metric{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px;
  min-width:0;
}
.metric span{display:block;color:var(--muted);font-size:.76rem;font-weight:850}
.metric b{font-size:.96rem;color:var(--ink);font-weight:950}
.metric.big b{font-size:1.08rem}
.result-card{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.result-card .name{grid-column:1/-1}
.validation-box:not(:empty){
  margin:0 0 12px;
  padding:12px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow-soft);
}
.divider{height:1px;background:var(--line);margin:12px 0}
.empty{
  padding:13px;
  border-radius:13px;
  border:1px dashed var(--line-strong);
  background:var(--surface-2);
  color:var(--muted);
  text-align:center;
  font-weight:800;
}
.day-search-wrap{margin-top:8px}
.month-role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-top:10px}
.alert-card{border-right:4px solid var(--warn)}
.outlier-high{border-right:4px solid var(--ok)}
.outlier-low{border-right:4px solid var(--err)}
.copy-modal-backdrop,.shift-modal-backdrop{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(15,23,42,.48);
  backdrop-filter:blur(5px);
}
.copy-modal,.shift-modal{
  width:min(430px,100%);
  padding:18px;
  border-radius:22px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 28px 80px rgba(15,23,42,.28);
}
.copy-modal h3,.shift-modal h3{font-size:1.08rem;font-weight:950;margin-bottom:4px}
.copy-modal p,.shift-modal p{color:var(--muted);font-weight:750;margin:0 0 14px}
.copy-target{
  margin:10px 0;
  padding:10px;
  border-radius:13px;
  background:var(--accent-soft);
  color:var(--brand);
  font-weight:900;
}
.copy-modal-actions,.shift-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.copy-modal-cancel,.shift-modal-cancel{width:100%;margin-top:8px}
.fab{
  position:fixed;
  left:16px;right:16px;bottom:12px;
  z-index:70;
  max-width:var(--max);
  margin-inline:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px;
  border-radius:18px;
  background:rgba(15,23,42,.93);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 -8px 30px rgba(15,23,42,.24);
  backdrop-filter:blur(14px);
  pointer-events:none;
}
.fab>*{pointer-events:auto}
.fab .btn.secondary{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)}
.toast{
  position:fixed;left:16px;right:16px;bottom:92px;z-index:1100;
  max-width:var(--max);margin-inline:auto;
  padding:12px 14px;border-radius:14px;
  background:#111827;color:#fff;text-align:center;
  opacity:0;transform:translateY(8px);transition:.18s;
  pointer-events:none;font-weight:900;
  box-shadow:0 16px 42px rgba(15,23,42,.25);
}
.toast.show{opacity:1;transform:none}
.suggestions{
  position:relative;margin-top:5px;display:none;overflow:hidden;z-index:40;
  border:1px solid var(--line);border-radius:13px;background:#fff;
  box-shadow:0 14px 36px rgba(15,23,42,.12);
}
.suggestions.show{display:block}
.suggestion-item{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:#fff;color:var(--ink);padding:9px 10px;text-align:right}
.suggestion-item:hover,.suggestion-item:focus{background:var(--accent-soft);outline:none}
.suggestion-name{font-weight:950;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggestion-role{font-size:.8rem;color:var(--muted);white-space:nowrap}
.shift-grid{display:grid;gap:8px;margin-top:8px}
.shift-slot{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}
.shift-slot.empty-shift{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.shift-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:950;color:var(--ink)}
.shift-badge{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--brand);border:1px solid #c9dcf6;font-size:.82rem;font-weight:950}
.result-table{width:100%;border-collapse:separate;border-spacing:0 7px;margin-top:6px}
.result-table th{font-size:.78rem;color:var(--muted);text-align:right;font-weight:950;padding:0 8px 2px}
.result-table td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-weight:800}
.result-table td:first-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.result-table td:last-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
.print-area{display:none}
@media (min-width:1000px){
  #calcView .view-grid{grid-template-columns:minmax(0,1fr) 390px}
  #calcView .results-card{position:sticky;top:104px}
}
@media (max-width:920px){
  .shell-bar{grid-template-columns:1fr}
  .brand-block{display:none}
  .app-shell{grid-template-columns:1fr}
  .side-nav{position:sticky;top:88px;z-index:40;border-radius:18px;padding:7px;background:rgba(16,27,46,.96)}
  .nav-kicker,.nav-note{display:none}
  .tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .tab-btn{min-height:40px;justify-content:center;text-align:center;padding:0 4px;font-size:.82rem}
  .tab-btn::after{display:none}
  .view-grid{grid-template-columns:1fr}
  .top-workspace{min-height:auto}
}
@media (max-width:620px){
  body{padding-inline:9px;font-size:14.5px}
  .topbar{margin-inline:-9px;padding:10px 9px}
  .top-workspace{display:grid;gap:8px;border-radius:16px}
  .workspace-title{font-size:.98rem}
  .cloud-row{justify-content:stretch}
  .cloud-row>*{flex:1}
  .tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tab-btn{font-size:.72rem;min-height:38px;border-radius:11px}
  .report-meta-grid,.department-grid,.grid{grid-template-columns:1fr}
  .kpi-grid,.result-card{grid-template-columns:1fr 1fr}
  .hero-kpi{grid-column:1/-1}
  .card{padding:12px;border-radius:15px}
  .section-head,.panel-head{margin:-12px -12px 12px;padding:12px;border-radius:15px 15px 0 0}
  .fab{left:9px;right:9px;bottom:9px;border-radius:16px}
  .toast{left:9px;right:9px}
}
@media print{
  body{background:#fff!important;color:#000;max-width:none;padding:0}
  .topbar,.side-nav,.fab,.toast,.view:not(.print-view),.no-print{display:none!important}
  .app-shell{display:block}.print-area{display:block!important;padding:18px}
  .card,.summary-card,.result-card{box-shadow:none;border-color:#999;break-inside:avoid}
  .print-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
}

  .nav-kicker::before{width:48px;height:48px;border-radius:16px}
  .tab-btn{
    min-height:112px!important;
    grid-template-columns:64px 1fr!important;
    gap:14px!important;
    padding:18px 22px!important;
    border-radius:26px!important;
  }
  .tab-btn::after{width:56px!important;height:56px!important;border-radius:18px!important}
  .tab-btn span{font-size:1.44rem!important}
  .tab-btn small{font-size:1rem!important}
  .card{padding:18px!important;border-radius:26px!important}
  .section-head h2,h2{font-size:1.42rem!important}
  .report-meta-grid,
  .grid{grid-template-columns:1fr!important}
  .kpi-grid,
  .result-card{grid-template-columns:1fr 1fr!important}
  .worker-head,
  .employee-head,
  .day-head,
  .summary-head{align-items:flex-start!important}
}



:root{
  --ink-bg:#171724!important;
  --ink-bg-2:#202031!important;
  --ink-bg-3:#28283b!important;
  --ink-panel:#2b2b3d!important;
  --ink-panel-2:#353548!important;
  --ink-panel-3:#3d3d50!important;
  --ink-line:rgba(255,255,255,.105)!important;
  --ink-line-2:rgba(255,255,255,.17)!important;
  --text-main:#fbfbff!important;
  --text-soft:#cfd5ee!important;
  --text-dim:#91a0d8!important;
  --gold:#ffb635!important;
  --gold-2:#d9941e!important;
  --blue:#87a2ff!important;
  --green:#5ed69b!important;
  --red:#ff7f93!important;
  --purple:#8d6cff!important;
  --radius:28px!important;
  --radius-sm:18px!important;

}
html{

    radial-gradient(circle at 18% -8%,rgba(84,92,139,.28),transparent 30%),
    linear-gradient(180deg,#191927,#151522 72%,#12121d 100%)!important;
}
body{
  max-width:1180px!important;
  color:var(--text-main)!important;
  padding:18px 18px calc(106px + env(safe-area-inset-bottom))!important;
  background:
    radial-gradient(circle at 14% 2%,rgba(73,79,123,.22),transparent 27%),
    radial-gradient(circle at 92% 8%,rgba(255,182,53,.07),transparent 22%),
    linear-gradient(180deg,#1c1c2b 0,#171724 55%,#141421 100%)!important;
  font:650 16px/1.34 "Assistant","Heebo",Arial,system-ui,sans-serif!important;
}
body::before{
  content:""!important;
  display:block!important;
  position:fixed!important;
  inset:0!important;
  z-index:-1!important;
  pointer-events:none!important;
  background:
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,255,.014) 1px,transparent 1px)!important;
  background-size:42px 42px!important;

}
.topbar{

}
.shell-bar{

.brand-block{

.app-shell{
  display:grid!important;
  grid-template-columns:244px minmax(0,1fr)!important;
  gap:18px!important;

}
main{
  min-width:0!important;
}
.side-nav{
  position:sticky!important;
  top:104px!important;
  padding:14px!important;
  border-radius:30px!important;
  background:
    linear-gradient(180deg,rgba(43,43,61,.94),rgba(28,28,44,.96))!important;

  box-shadow:var(--shadow-soft)!important;

}
.side-nav::before{
  content:""!important;
  position:absolute!important;
  inset:-60px -20px auto auto!important;
  width:150px!important;
  height:150px!important;
  border-radius:50%!important;
  background:rgba(255,182,53,.08)!important;
  pointer-events:none!important;
}
.nav-kicker{
  color:#fff!important;

  margin:6px 8px 12px!important;
}

  margin:14px 8px 4px!important;

  border-top:1px solid rgba(255,255,255,.09)!important;
  color:var(--text-dim)!important;
  font-size:.86rem!important;
  font-weight:800!important;
}
.tabs{
  display:grid!important;
  gap:12px!important;
  background:transparent!important;
  border:0!important;
  padding:0!important;
}
.tab-btn{
  position:relative!important;
  min-height:74px!important;
  border-radius:24px!important;
  border:1px solid rgba(255,255,255,.12)!important;
  background:rgba(255,255,255,.045)!important;
  color:#fff!important;
  padding:14px 16px 14px 70px!important;
  display:grid!important;
  grid-template-columns:1fr!important;
  place-items:center end!important;
  text-align:right!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)!important;
  overflow:hidden!important;
}
.tab-btn::before{
  content:""!important;
  position:absolute!important;
  inset:auto auto 0 0!important;
  width:92px!important;
  height:92px!important;
  border-radius:50%!important;
  transform:translate(-22px,28px)!important;
  opacity:.22!important;
  background:var(--tab-glow,rgba(255,182,53,.45))!important;
}
.tab-btn::after{
  content:""!important;
  position:absolute!important;
  left:14px!important;
  top:50%!important;
  width:42px!important;
  height:42px!important;
  transform:translateY(-50%)!important;
  border-radius:15px!important;
  background:rgba(255,182,53,.13)!important;
  border:1px solid rgba(255,182,53,.24)!important;
}
.tab-btn:nth-child(1){--tab-glow:rgba(255,182,53,.62)}
.tab-btn:nth-child(2){--tab-glow:rgba(94,214,155,.52)}
.tab-btn:nth-child(3){--tab-glow:rgba(255,127,147,.45)}
.tab-btn:nth-child(4){--tab-glow:rgba(135,162,255,.56)}
.tab-btn span{
  position:relative!important;
  z-index:1!important;
  font-size:1.08rem!important;
  font-weight:950!important;
  line-height:1.05!important;
}
.tab-btn small{
  position:relative!important;
  z-index:1!important;
  color:var(--blue)!important;
  font-size:.86rem!important;
  font-weight:850!important;
  margin-top:4px!important;
}
.tab-btn.active{
  border-color:rgba(255,182,53,.42)!important;
  background:linear-gradient(135deg,rgba(255,182,53,.19),rgba(255,255,255,.06))!important;
  box-shadow:0 14px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.055)!important;
}

}

function normalizeShift(value){
  const v=String(value||'').trim().toLowerCase();
  if(['morning','בוקר','am','1'].includes(v))return 'morning';

function loadJson(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function saveJson(key,value){localStorage.setItem(key,JSON.stringify(value))}
function persist(){saveJson(LS_EMPLOYEES,employees);saveJson(LS_DAYS,days);saveJson(LS_CLOSED,closedMonths);saveJson(LS_DELETED_DAYS,deletedDays);queueCloudSave()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function cloudConfigured(){return !!(CLOUD_CONFIG.supabaseUrl&&CLOUD_CONFIG.supabaseAnonKey&&window.supabase)}
function setCloudStatus(text,mode=''){const el=document.getElementById('cloudStatus');if(!el)return;el.textContent=text;el.className='pill cloud-pill '+mode}
function appData(){return {employees,days,closedMonths,deletedDays,version:10,updatedAt:new Date().toISOString()}}
function hasUsefulData(data){return !!(data&&(data.employees?.length||data.days?.length||data.closedMonths?.length))}
function recordTime(item){return Date.parse(item?.updatedAt||item?.createdAt||item?.closedAt||0)||0}
function newestRecord(a,b){return recordTime(b)>=recordTime(a)?b:a}
function mergeByKey(remoteList=[],localList=[],keyFn){
  const map=new Map();
  (Array.isArray(remoteList)?remoteList:[]).forEach(item=>{const key=keyFn(item);if(key)map.set(key,item)});
  (Array.isArray(localList)?localList:[]).forEach(item=>{
    const key=keyFn(item);
    if(!key)return;
    map.set(key,map.has(key)?newestRecord(map.get(key),item):item);
  });
  return [...map.values()];
}
function mergeClosedMonths(remoteList=[],localList=[]){return mergeByKey(remoteList,localList,m=>String(m?.month||''))}
function mergeAppData(remoteData={},localData={}){
  const mergedDeletedDays=mergeByKey(remoteData.deletedDays,localData.deletedDays,d=>String(d?.id||''));
  const deletedIds=new Set(mergedDeletedDays.map(d=>String(d.id||'')));
  const mergedDays=mergeByKey(remoteData.days,localData.days,d=>String(d?.id||d?.date||''))
    .filter(d=>!deletedIds.has(String(d?.id||'')));
  return {
    employees:mergeByKey(remoteData.employees,localData.employees,e=>employeeKey(e)||String(e?.id||e?.name||'')),
    days:mergedDays,
    closedMonths:mergeClosedMonths(remoteData.closedMonths,localData.closedMonths),
    deletedDays:mergedDeletedDays,
    version:Math.max(Number(remoteData.version)||0,Number(localData.version)||0,10),
    updatedAt:new Date().toISOString()
  };
}
function applyCloudData(data){
  if(!data||typeof data!=='object')return;
  applyingCloudState=true;
  employees=Array.isArray(data.employees)?data.employees:[];
  days=Array.isArray(data.days)?data.days:[];
  closedMonths=Array.isArray(data.closedMonths)?data.closedMonths:[];
  deletedDays=Array.isArray(data.deletedDays)?data.deletedDays:[];
  saveJson(LS_EMPLOYEES,employees);
  saveJson(LS_DAYS,days);
  saveJson(LS_CLOSED,closedMonths);
  saveJson(LS_DELETED_DAYS,deletedDays);
  migrateData();
  refreshEmployeeLists();
  renderEmployees();
  renderDays();
  renderMonth();
  updateEditStatus();
  checkExistingShift();
  renderReportValidation();
  applyingCloudState=false;
}
async function loadCloudNow({silent=false}={}){
  if(!cloudClient&&cloudConfigured())cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
  if(!cloudClient)return false;
  try{
    const {data,error}=await cloudClient.from('app_state').select('data,updated_by,updated_at').eq('restaurant_id',CLOUD_CONFIG.restaurantId).maybeSingle();
    if(error)throw error;
    if(hasUsefulData(data?.data)){
      applyCloudData(data.data);
      if(!silent)setCloudStatus('מחובר לענן','ok');
      return true;
    }
    return false;
  }catch(err){
    console.error(err);
    if(!silent)setCloudStatus('שגיאת קריאה מהענן','err');
    return false;
  }
}
async function importCloudAndRefresh(){
  setCloudStatus('מייבא נתונים מהענן...');
  const pulled=await loadCloudNow({silent:false});
  if(pulled){
    const active=document.querySelector('.view.active')?.id;
    if(active==='employeesView')renderEmployees();
    if(active==='journalView')renderDays();
    if(active==='monthView')renderMonth();

    setCloudStatus('מחובר לענן','ok');
    toast('הנתונים יובאו ורועננו מהענן');

  setCloudStatus('אין נתונים למשיכה מהענן','warn');
  toast('לא נמצאו נתונים חדשים בענן');
}
async function manualCloudSync(){
  return importCloudAndRefresh();
}
function startCloudPolling(){
  clearInterval(window.__cloudPollTimer);
  window.__cloudPollTimer=setInterval(()=>{
    if(!document.hidden&&cloudReady)loadCloudNow({silent:true});
  },15000);
}
async function initCloud(){
  if(!cloudConfigured()){setCloudStatus('ענן לא מוגדר');return}
  try{
    cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
    setCloudStatus('מתחבר לענן...');
    const loaded=await loadCloudNow({silent:true});
    if(!loaded){await saveCloudNow();setCloudStatus(hasUsefulData(appData())?'נתונים מקומיים הועלו לענן':'ענן נוצר','ok')}
    cloudReady=true;
    cloudSubscription=cloudClient.channel(`app_state_${CLOUD_CONFIG.restaurantId}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:`restaurant_id=eq.${CLOUD_CONFIG.restaurantId}`},payload=>{
        if(payload.new?.updated_by===cloudClientId)return;
        applyCloudData(payload.new?.data);
        toast('נתונים עודכנו מהענן');
      })
      .subscribe((status)=>{
        if(status==='SUBSCRIBED')setCloudStatus('מחובר לענן · סנכרון חי','ok');
        if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')setCloudStatus('מחובר לענן · ללא סנכרון חי','warn');
      });
    window.addEventListener('focus',()=>loadCloudNow({silent:true}));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadCloudNow({silent:true})});
    startCloudPolling();
  }catch(err){
    console.error(err);
    setCloudStatus('שגיאת ענן','err');
    toast('לא הצלחנו להתחבר לענן');
  }
}
function queueCloudSave(){
  if(applyingCloudState||!cloudReady)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(saveCloudNow,650);
}
async function saveCloudNow(){
  if(!cloudClient&&cloudConfigured())cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
  if(!cloudClient){setCloudStatus('ענן לא מוגדר','err');return false}
  try{
    const localSnapshot=appData();
    const {data:remoteRow,error:readError}=await cloudClient.from('app_state').select('data').eq('restaurant_id',CLOUD_CONFIG.restaurantId).maybeSingle();
    if(readError)throw readError;
    const payload=hasUsefulData(remoteRow?.data)?mergeAppData(remoteRow.data,localSnapshot):localSnapshot;
    const {error}=await cloudClient.from('app_state').upsert({restaurant_id:CLOUD_CONFIG.restaurantId,data:payload,updated_by:cloudClientId,updated_at:new Date().toISOString()},{onConflict:'restaurant_id'});
    if(error)throw error;
    if(JSON.stringify(payload)!==JSON.stringify(localSnapshot))applyCloudData(payload);
    setCloudStatus('מחובר לענן','ok');
    return true;
  }catch(err){
    console.error(err);
    setCloudStatus('שגיאת שמירה בענן','err');
    return false;
  }
}
function getEmployeeById(id){const value=String(id||'');if(!value)return null;return employees.find(e=>String(e.id)===value)||null}
function roleText(role){
  // Translate internal role identifiers to Hebrew text. Return empty string when no role.
  if(role==='bar') return 'ברמן';
  if(role==='waiter') return 'מלצר';
  if(role==='both') return 'גם וגם';
  if(role==='host') return 'מארחת';
  if(role==='manager') return 'אחמ״ש';
  return '';
}
function isMonthClosed(month){return closedMonths.some(m=>m.month===month)}
function migrateData(){
  let changed=false;
  const deletedIds=new Set((Array.isArray(deletedDays)?deletedDays:[]).map(d=>String(d.id||'')));
  if(deletedIds.size){const before=days.length;days=days.filter(d=>!deletedIds.has(String(d.id||'')));if(days.length!==before)changed=true}
  employees=employees.map(e=>{
    const next={...e};
    if(!next.uid){next.uid=employeeUid();changed=true}
    if(next.active===undefined){next.active=true;changed=true}
    return next;
  });
  days=days.map(d=>{
    const workers=(d.workers||[]).map(w=>{
      if(w.empUid) return w;
      const match=getEmployeeById(w.empId)||employees.find(e=>String(e.name)===String(w.nameSnapshot||w.name));
      if(match){changed=true;return {...w,empUid:employeeKey(match)}}
      return w;
    });
    const next={...d,workers};
    const normalizedShift=normalizeShift(next.shift);
    if(next.shift!==normalizedShift){next.shift=normalizedShift;changed=true}
    if(next.locked===undefined){next.locked=true;next.editCount=next.editCount||0;changed=true}
    if(next.hostHours===undefined){next.hostHours=roundMoney(workers.filter(w=>w.role==='host').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    if(next.managerHours===undefined){next.managerHours=roundMoney(workers.filter(w=>w.role==='manager').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    return next;
  });
  if(changed)persist();
}

function toggleWeekendState(){const enabled=document.getElementById('enableBarCut').checked;const weekend=document.getElementById('isWeekend');const wrapper=document.getElementById('weekendWrapper');if(!enabled){weekend.checked=false;weekend.disabled=true;wrapper.classList.add('disabled-option')}else{weekend.disabled=false;wrapper.classList.remove('disabled-option')}}

  const normalized=normalizeShift(shift);

function validateReportForSave(calc=null){
  const checks=[];
  const date=document.getElementById('workDate')?.value||'';
  const shift=getSelectedShift();
  const totalTip=floorMoney(document.getElementById('totalTip')?.value||0);
  const roleData=roleOrder.map(role=>({role,...getShiftWorkers(role,false)}));
  const workers=roleData.flatMap(x=>x.workers);
  const errors=roleData.flatMap(x=>x.errors);
  const seen=new Map();const duplicateNames=[];
  workers.forEach(w=>{const key=w.empUid||w.empId||w.name;if(seen.has(key))duplicateNames.push(w.name);else seen.set(key,w)});
  checks.push({level:date?'ok':'err',text:date?'יש תאריך':'חסר תאריך'});
  checks.push({level:shift?'ok':'err',text:`משמרת: ${shiftText(shift)}`});
  checks.push({level:workers.length?'ok':'err',text:workers.length?`${workers.length} עובדים בדוח`:'לא נוספו עובדים'});
  checks.push({level:totalTip>0?'ok':'err',text:totalTip>0?`סה״כ טיפים ${fmt(totalTip)}`:'חסר סה״כ טיפים'});
  if(errors.length)checks.push(...errors.map(text=>({level:'err',text})));
  if(duplicateNames.length)checks.push({level:'err',text:'עובד מופיע יותר מפעם אחת בדוח: '+[...new Set(duplicateNames)].join(', ')});
  if(!workers.some(w=>w.role==='waiter'))checks.push({level:'err',text:'חסר לפחות מלצר אחד'});
  if(document.getElementById('enableBarCut')?.checked&&!workers.some(w=>w.role==='bar'))checks.push({level:'err',text:'הפרשה לבר פעילה אבל אין ברמן'});
  if(calc?.ok)checks.push({level:'ok',text:'חישוב הטיפים תקין'});
  const ok=!checks.some(c=>c.level==='err');
  return {ok,checks};
}

function saveEmployee(){
  const id = normalizeId(document.getElementById('empId').value);
  const name = document.getElementById('empName').value.trim();
  // derive default role from checkboxes (waiter/bar). allow multiple roles
  const waiter = document.getElementById('empRoleWaiter').checked;
  const bar = document.getElementById('empRoleBar').checked;
  const host = document.getElementById('empRoleHost')?.checked;
  const manager = document.getElementById('empRoleManager')?.checked;
  // determine defaultRole: host/manager take precedence, then waiter+bar, then individual waiter or bar
  let defaultRole = '';
  if (host) defaultRole = 'host';
  else if (manager) defaultRole = 'manager';
  else if (waiter && bar) defaultRole = 'both';
  else if (waiter) defaultRole = 'waiter';
  else if (bar) defaultRole = 'bar';
  else defaultRole = '';
  // set default stars only for waiter/bar roles; hosts and managers ignore star rating (still stored but unused)
  let defaultStars = Number(document.getElementById('empDefaultStars').value) || 6;
  if (defaultRole === 'host' || defaultRole === 'manager') {
    defaultStars = 6;
  }
  const active = document.getElementById('empActive').checked;
  // require only a name; id is optional
  if (!name) {
    toast('חסר שם');
    return;
  }
  // check duplicate id only when id exists
  if (id) {
    const duplicate = employees.find(e => String(e.id) === String(id) && employeeKey(e) !== String(editingEmployeeId));
    if (duplicate) {
      toast('מס׳ עובד כבר קיים');
      return;
    }
  }
  const previous = editingEmployeeId ? getEmployeeByKey(editingEmployeeId) : null;
  const record = {
    uid: previous?.uid || employeeUid(),
    id,
    name,
    defaultRole,
    defaultStars,
    active,
    createdAt: previous?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if (editingEmployeeId) {
    employees = employees.map(e => employeeKey(e) === String(editingEmployeeId) ? record : e);
    editingEmployeeId = null;
  } else {
    employees.push(record);
  }
  employees.sort((a,b) => String(a.name).localeCompare(String(b.name),'he'));
  persist();
  resetEmployeeForm();
  renderEmployees();
  refreshEmployeeLists();

function getShiftWorkers(type,strict=false){
  const rows=[...document.querySelectorAll(`#${type}Container .worker-card`)];
  const out=[];
  const errors=[];
  rows.forEach((row,i)=>{
    const input=row.querySelector(`input[data-worker-role="${type}"]`);

    let hours=Number(row.querySelector(`input[id^='${type}Hours']`)?.value||0);

    if(hours<=0){errors.push(`${emp.name}: חסרות שעות`);return}
    let stars=(type==='bar'||type==='waiter')?(emp.defaultStars||6):6;
    const has=row.querySelector(`input[id^='${type}HasStars']`)?.checked;
    if(has){const sel=row.querySelector(`input[name^='${type}Stars']:checked`);if(sel)stars=Number(sel.value)}
    out.push({role:type,empUid:employeeKey(emp),empId:emp.id||'',name:emp.name,nameSnapshot:emp.name,hours,stars});
  });
  const dup=new Set();
  const seen=new Set();
  out.forEach(w=>{const key=w.role+'|'+(w.empUid||w.empId||w.name);if(seen.has(key))dup.add(w.name);seen.add(key)});
  if(dup.size)errors.push('עובד מופיע פעמיים באותו תפקיד: '+[...dup].join(', '));
  if(strict&&errors.length)throw new Error(errors.join('\n'));
  return {workers:out,errors};
}

function calculate(){
  const totalTip = floorMoney(document.getElementById('totalTip').value || 0);
  const date = document.getElementById('workDate').value || todayISO();
  const isWeekend = document.getElementById('isWeekend').checked;
  const enableBarCut = document.getElementById('enableBarCut').checked;
  const barPct = enableBarCut ? (isWeekend ? BAR_WEEKEND : BAR_WEEK) : 0;
  // Collect workers for each role
  const barData = getShiftWorkers('bar', false);
  const waiterData = getShiftWorkers('waiter', false);
  const hostData = getShiftWorkers('host', false);
  const managerData = getShiftWorkers('manager', false);
  const errors = [...barData.errors, ...waiterData.errors, ...hostData.errors, ...managerData.errors];
  const waiters = waiterData.workers;
  const bars = barData.workers;
  const hosts = hostData.workers;
  const managers = managerData.workers;
  const waiterHours = waiters.reduce((s, w) => s + w.hours, 0);
  if (totalTip <= 0) errors.push('חסר סה״כ טיפים');
  // Require at least one waiter for distribution; hosts/managers do not count for this validation
  if (waiters.length === 0) errors.push('חסר לפחות מלצר אחד');
  if (enableBarCut && bars.length === 0) errors.push('הפרשה לבר פעילה אבל אין ברמן במשמרת');
  if (errors.length) return { ok: false, errors };
  const barTip = floorMoney(totalTip * barPct);
  const remaining = totalTip - barTip;
  // Determine restaurant percentage based on hourly pay after restaurant cut
  let restPct = 0.15;
  const avgWith = p => (remaining * (1 - p)) / waiterHours;
  if (avgWith(0.20) >= 100) restPct = 0.20;
  else if (avgWith(0.17) >= 90) restPct = 0.17;
  const restCut = floorMoney(remaining * restPct);
  const finalForWaiters = floorMoney(remaining - restCut);
  // Compute pays for waiters
  const effWaiters = waiters.reduce((s, w) => s + w.hours * w.stars, 0);
  const perWaiter = effWaiters ? finalForWaiters / effWaiters : 0;
  const waiterRows = waiters.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perWaiter), rate: w.hours ? floorMoney((w.hours * w.stars * perWaiter) / w.hours) : 0 }));
  // Compute pays for bartenders
  const effBar = bars.reduce((s, w) => s + w.hours * w.stars, 0);
  const perBar = effBar ? barTip / effBar : 0;
  const barRows = bars.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perBar), rate: w.hours ? floorMoney((w.hours * w.stars * perBar) / w.hours) : 0 }));
  // Hosts and managers do not receive tips; assign zero pay and rate
  const hostRows = hosts.map(w => ({ ...w, pay: 0, rate: 0 }));
  const managerRows = managers.map(w => ({ ...w, pay: 0, rate: 0 }));
  const avgHourly = waiterHours ? finalForWaiters / waiterHours : 0;
  return {
    ok: true,
    date,
    totalTip,
    isWeekend,
    enableBarCut,
    barPct,
    barTip,
    restPct,
    restCut,
    finalForWaiters,
    avgHourly: floorMoney(avgHourly),
    waiterHours: roundMoney(waiterHours),
    barHours: roundMoney(bars.reduce((s, w) => s + w.hours, 0)),
    hostHours: roundMoney(hosts.reduce((s, w) => s + w.hours, 0)),
    managerHours: roundMoney(managers.reduce((s, w) => s + w.hours, 0)),
    waiters: waiterRows.sort((a, b) => b.pay - a.pay),
    bars: barRows.sort((a, b) => b.pay - a.pay),
    hosts: hostRows.sort((a, b) => b.hours - a.hours),
    managers: managerRows.sort((a, b) => b.hours - a.hours)
  };
}
function calculateAndRender(scroll=false){const calc=calculate();if(!calc.ok){renderReportValidation();setReportStatus('בדיקה נכשלה','err');toast(calc.errors[0]);return null}lastCalculation=calc;renderResults(calc);renderReportValidation(calc);setReportStatus('חושב','ok');if(scroll)document.getElementById('calcResults').scrollIntoView({behavior:'smooth',block:'start'});return calc}
function renderResults(c){
  // Show results container (sticky summary removed to avoid duplication)
  document.getElementById('calcResults').classList.remove('hidden');
  // Build macro KPI grid in requested order: total tip, bar cut, restaurant cut, net waiters, average hourly, then hours per role
  document.getElementById('resultsMacro').innerHTML = `

function resolveDuplicateDaySave(calc,shift){
  const normalizedShift=normalizeShift(shift);
  const existing=days.find(d=>d.date===calc.date&&normalizeShift(d.shift)===normalizedShift&&d.id!==loadedDayId);
  if(!existing)return {id:loadedDayId,copyNo:0};
  if(confirm(`כבר קיימת משמרת ${shiftText(normalizedShift)} לתאריך הזה. להחליף אותה?`))return {id:existing.id,copyNo:existing.copyNo||0};
  if(confirm('לשמור כעותק נוסף במקום להחליף?'))return {id:loadedDayId,copyNo:days.filter(d=>d.date===calc.date&&normalizeShift(d.shift)===normalizedShift).length};

  return null;
}
async function saveDay(){

  const month=monthOfDate(calc.date);
  if(isMonthClosed(month)){toast('החודש סגור לעריכה');return}
  const shift=getSelectedShift();
  const duplicateChoice=resolveDuplicateDaySave(calc,shift);
  if(!duplicateChoice)return;
  const id=duplicateChoice.id;
  const copyNo=duplicateChoice.copyNo;
  const old=id?days.find(d=>d.id===id):null;
  const record=buildDayRecord(calc,id,copyNo,shift);
  if(old){record.createdAt=old.createdAt;record.editCount=(old.editCount||0)+1;days=days.map(d=>d.id===id?record:d)}else{days.push(record)}
  days.sort((a,b)=>String(a.date).localeCompare(String(b.date))||shiftSortValue(a.shift)-shiftSortValue(b.shift)||(a.copyNo||0)-(b.copyNo||0));
  persist();loadedDayId=record.id;lastCalculation=calc;renderDays();renderMonth();updateEditStatus();checkExistingShift();
  setReportStatus('שומר בענן','warn');
  const ok=await saveCloudNow();
  setReportStatus(ok?'מסונכרן בענן':'נשמר מקומית',ok?'ok':'warn');
  toast(ok?`דוח ${shiftText(record.shift)} נשמר וסונכרן`:'הדוח נשמר מקומית — יש בעיית סנכרון');

function makeMonthMacro(md){return md.reduce((a,d)=>({days:a.days+1,totalTip:a.totalTip+Number(d.totalTip||0),finalForWaiters:a.finalForWaiters+Number(d.finalForWaiters||0),barTip:a.barTip+Number(d.barTip||0),restCut:a.restCut+Number(d.restCut||0),waiterHours:a.waiterHours+Number(d.waiterHours||0),barHours:a.barHours+Number(d.barHours||0),hostHours:a.hostHours+Number(d.hostHours??(d.workers||[]).filter(w=>w.role==='host').reduce((s,w)=>s+Number(w.hours||0),0)),managerHours:a.managerHours+Number(d.managerHours??(d.workers||[]).filter(w=>w.role==='manager').reduce((s,w)=>s+Number(w.hours||0),0))}),{days:0,totalTip:0,finalForWaiters:0,barTip:0,restCut:0,waiterHours:0,barHours:0,hostHours:0,managerHours:0})}
function monthWorkerSummary(md,role='all'){const map=new Map();md.forEach(d=>(d.workers||[]).forEach(w=>{if(role!=='all'&&w.role!==role)return;const key=(w.empUid||w.empId||w.nameSnapshot||w.name)+'|'+w.role;if(!map.has(key)){const emp=getEmployeeByKey(w.empUid)||getEmployeeById(w.empId);map.set(key,{empUid:w.empUid||'',empId:w.empId||'',name:emp?.name||w.nameSnapshot||w.name,role:w.role,hours:0,pay:0,days:new Set()})}const item=map.get(key);item.hours+=Number(w.hours||0);item.pay+=Number(w.pay||0);item.days.add(`${d.date}|${normalizeShift(d.shift)}`)}));return [...map.values()]}
function renderAlerts(md){const alerts=buildAlerts(md);document.getElementById('monthAlerts').innerHTML=alerts.length?`<div class="divider"></div><h3>בדיקת חודש</h3>${alerts.map(a=>`<div class="alert-card"><b class="${a.level==='err'?'danger-text':'warn-text'}">${escapeHTML(a.title)}</b><div class="muted">${escapeHTML(a.detail)}</div></div>`).join('')}`:'<div class="alert-card"><b class="ok-text">לא נמצאו חריגות משמעותיות</b></div>'}
function buildAlerts(md,month=''){
  const alerts=[];
  const byDate={};
  if(!md.length){
    alerts.push({level:'err',title:'אין ימים שמורים בחודש',detail:month||'החודש הנבחר'});
    return alerts;
  }
  md.forEach(d=>{
    const dateShiftKey=`${d.date}|${normalizeShift(d.shift)}`;
    byDate[dateShiftKey]=(byDate[dateShiftKey]||0)+1;
    // No tip total on this day
    if(!d.totalTip) alerts.push({level:'err',title:'משמרת עם 0 טיפים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing waiters on this day
    if(!(d.workers||[]).some(w=>w.role==='waiter')) alerts.push({level:'err',title:'משמרת ללא מלצרים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing bartenders on this day
    if(!(d.workers||[]).some(w=>w.role==='bar')) alerts.push({level:'warn',title:'משמרת ללא ברמנים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Hourly rate out of reasonable range

    document.body.classList.add("operator-first-v6");

    document.querySelectorAll("h1,h2,h3,label,button,span,p,small,div").forEach(el=>{
      if(el.children.length > 0 && !el.classList.contains("brand-title") && !el.classList.contains("workspace-title")) return;
      cleanTextNode(el);
    });

    document.querySelectorAll(".tab-btn").forEach(btn=>{
      const view = btn.getAttribute("data-view");
      const span = btn.querySelector("span") || btn;
      if(view === "calcView") span.textContent = "סגירה";
      if(view === "employeesView") span.textContent = "עובדים";
      if(view === "journalView") span.textContent = "דוחות";
      if(view === "monthView") span.textContent = "חודש";
    });

    const workspace = document.querySelector(".workspace-title");
    if(workspace) workspace.textContent = "סגירת משמרת";

    const brand = document.querySelector(".brand-title");
    if(brand) brand.textContent = "הצדף";

    const total = document.querySelector("#totalTip");
    if(total && !total.dataset.ofV6Placeholder){
      total.placeholder = "₪";
      total.dataset.ofV6Placeholder = "1";
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", apply, {once:true});
  } else {
    apply();
  }

  let raf = 0;
  new MutationObserver(()=>{
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(apply);
  }).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
})();
</script>


<script id="operator-first-v7-script">
(function(){
  const removeExact = new Set([
    "שעות וטיפים",
    "שעות בלבד",
    "שעות בלבד בלי טיפים",
    "פעיל לבחירה במשמרות",
    "ייבוא צוות מדוח קודם",
    "הערות משמרת",
    "רשימת עובדים",
    "חיפוש עובד",
    "מחלקה",
    "ייצוא יומן CSV",
    "ייצוא חודש",
    "ייצוא חריגות",
    "דוח להדפסה"
  ]);
  const replace = new Map([
    ["צוות המשמרת","צוות"],
    ["סה״כ טיפים","טיפים"],
    ["שמור דוח","שמור"],
    ["פתח דוח חדש","חדש"],
    ["ייבוא צוות מדוח קודם","ייבוא"],
    ["הוסף מלצר","+ מלצר"],
    ["הוסף ברמן","+ ברמן"],
    ["הוסף מארחת","+ מארחת"],
    ["הוסף אחמ״ש","+ אחמ״ש"],
    ["נקה טופס","נקה"],
    ["שמור עובד","שמור"],
    ["מס׳ עובד","מספר"],
    ["שם מלא","שם"],
    ["תפקידים","תפקיד"],
    ["כוכבים","כוכבים"],
    ["הערות","הערות"],
    ["סגירת משמרת","משמרת"],
    ["דוחות","דוחות"],
    ["חודש","חודש"]
  ]);
  function cleanLeaf(el){
    if(!el || el.dataset.ofV7 === "1") return;
    const raw = (el.textContent || "").replace(/\s+/g," ").trim();
    if(!raw) return;
    if(removeExact.has(raw)){
      if(el.matches("label,small,p,.summary-sub,.employee-sub,.worker-sub")) el.remove();
      else el.textContent = "";
      el.dataset.ofV7 = "1";
      return;
    }
    if(replace.has(raw)){
      el.textContent = replace.get(raw);
      el.dataset.ofV7 = "1";
    }
  }
  function refine(){
    document.body.classList.add("operator-first-v7");
    document.documentElement.lang = "he";
    document.documentElement.dir = "rtl";

    document.querySelectorAll("h1,h2,h3,label,button,span,p,small").forEach(cleanLeaf);

    const brand = document.querySelector(".brand-title");
    if(brand) brand.textContent = "הצדף";

    const workspace = document.querySelector(".workspace-title");
    if(workspace) workspace.textContent = "";

    document.querySelectorAll(".tab-btn").forEach(btn=>{
      const view = btn.getAttribute("data-view");
      const target = btn.querySelector("span") || btn;
      if(view === "calcView") target.textContent = "משמרת";
      if(view === "employeesView") target.textContent = "עובדים";
      if(view === "journalView") target.textContent = "דוחות";
      if(view === "monthView") target.textContent = "חודש";
    });

    const importBtn = document.querySelector('button[onclick="openCopyPreviousModal()"]');
    if(importBtn) importBtn.textContent = "ייבוא";

    const total = document.querySelector("#totalTip");
    if(total) total.placeholder = "₪";

    const notes = document.querySelector("#shiftNotes");
    if(notes) notes.placeholder = "";

    const fab = document.querySelector("#shiftFab");
    if(fab && fab.children.length >= 2){
      fab.children[0].textContent = "חשב";
      fab.children[1].textContent = "שמור";
    }
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", refine, {once:true});
  } else {
    refine();
  }
  let frame = 0;
  new MutationObserver(()=>{
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(refine);
  }).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
})();
</script>


<script id="operator-first-v8-script">
(function(){
  function trimTopAndLayout(){
    document.body.classList.add("operator-first-v8");
    document.documentElement.lang = "he";
    document.documentElement.dir = "rtl";

    const removeTexts = new Set([
      "שעות וטיפים",
      "שעות בלבד",
      "שעות בלבד בלי טיפים",
      "הזן סכום טיפים לחלוקה",
      "בדוק את הנתונים לפני שמירה",
      "Beecomm Shifts",
      "beecomm shifts",
      "BEECOMM SHIFTS"
    ]);

    document.querySelectorAll("small,p,span,div,label,h1,h2,h3,button").forEach(el=>{
      const text = (el.textContent || "").trim().replace(/\s+/g," ");
      if(removeTexts.has(text)){
        el.remove();
      }
    });

    const brand = document.querySelector(".brand-title");
    if(brand) brand.textContent = "הצדף";

    const workspaceTitle = document.querySelector(".workspace-title");
    if(workspaceTitle) workspaceTitle.textContent = "";

    const fab = document.getElementById("shiftFab");
    if(fab){
      const buttons = Array.from(fab.querySelectorAll("button"));
      buttons.forEach(btn=>{
        const t = (btn.textContent || "").trim();
        if(t === "חשב") btn.textContent = "חשב";
        if(t === "שמור דוח") btn.textContent = "שמור";
      });
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", trimTopAndLayout);
  }else{
    trimTopAndLayout();
  }

  const observer = new MutationObserver(()=>trimTopAndLayout());
  observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
})();
</script>
