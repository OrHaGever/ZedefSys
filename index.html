  <style>

    .switch-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}.switch-label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--fg)}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--border);font-size:.86rem;color:var(--muted)}.pill.ok{color:var(--ok)}.pill.err{color:var(--err)}.disabled-option{opacity:.45;pointer-events:none}
    .kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:11px;min-width:0}.kpi span{display:block;color:var(--muted);font-size:.82rem}.kpi b{display:block;font-size:1.25rem;margin-top:3px;overflow-wrap:anywhere}.hero-kpi{grid-column:1/-1;background:var(--accent-soft);border-color:rgba(13,110,253,.3)}.hero-kpi b{font-size:1.8rem}
    .worker-card,.result-card,.day-card,.employee-card,.alert-card,.summary-card{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px;margin:8px 0}.worker-head,.employee-head,.day-head,.summary-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.worker-title,.employee-title,.day-title,.summary-title{font-weight:850;min-width:0;overflow-wrap:anywhere}.employee-sub,.worker-sub,.day-sub,.summary-sub{color:var(--muted);font-size:.9rem;margin-top:2px}.worker-actions,.employee-actions,.day-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto}.stars-options{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}.radio-chip{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:7px 10px;background:var(--soft);cursor:pointer;user-select:none}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.collapse-body.collapsed{display:none}
    .result-card{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.result-card .name{grid-column:1/-1;font-weight:850}.metric{background:var(--soft);border-radius:12px;padding:8px;min-width:0}.metric span{display:block;color:var(--muted);font-size:.78rem}.metric b{font-size:.95rem;overflow-wrap:anywhere}.metric.big b{font-size:1.15rem;font-weight:850}.outlier-high{border-right:4px solid var(--ok)}.outlier-low{border-right:4px solid var(--err)}
    .sticky-summary{position:sticky;top:66px;z-index:15;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}.fab{position:fixed;left:10px;right:10px;bottom:10px;z-index:30;max-width:880px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;pointer-events:none}.fab>*{pointer-events:auto}.toast{position:fixed;left:10px;right:10px;bottom:82px;z-index:40;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:880px;margin-inline:auto}.toast.show{opacity:1;transform:translateY(0)}

    @media (max-width:430px){body{padding-inline:9px}.tabs{gap:3px}.tab-btn{font-size:.78rem;padding:0 2px}.grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}.result-card{grid-template-columns:1fr 1fr}.worker-head,.employee-head,.day-head,.summary-head{align-items:flex-start}.fab{grid-template-columns:1fr 1fr}}
    @media print{body{background:#fff;color:#000;max-width:none;padding:0}.topbar,.fab,.toast,.view:not(.print-view),.no-print{display:none!important}.print-area{display:block!important;padding:18px}.print-area h1{text-align:right}.card,.summary-card,.result-card{box-shadow:none;border-color:#999;break-inside:avoid}.print-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}}

    /* --------------------------------------------------------------
       Icon helpers and accessibility classes
       These classes are used throughout the UI to embed small icons
       next to labels. They ensure proper alignment and spacing for
       both RTL and LTR directions. Icons appear after the text in
       the DOM (due to RTL) but margin-inline-start will add space
       between label and icon regardless of direction.
    -------------------------------------------------------------- */
    .icon {
      font-size: 1.2rem;
      margin-inline-start: 0.4rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    /* Specific adjustment for icons inside navigation tabs */
    .tab-btn .icon {
      margin-inline-start: 0.3rem;
      font-size: 1.1rem;
    }

    /* Emphasise metrics inside monthly summary cards for better readability on mobile. */
    .summary-card .kpi b{
      font-size: 1.15rem;
      font-weight: 850;
    }

    /* Premium operations redesign */
    :root{
      --bg:#08110f;
      --fg:#f6f1e8;
      --card:#111c18;
      --soft:#182823;
      --muted:#aab7ae;
      --accent:#d9ad55;
      --accent-soft:rgba(217,173,85,.16);
      --ok:#41d6a0;
      --warn:#f3b65f;
      --err:#ff6b6b;
      --border:rgba(246,241,232,.12);
      --input-bg:#0d1714;
      --input-fg:#fffaf0;
      --focus:rgba(65,214,160,.28);
      --radius:16px;
      --touch:58px;
      --gap:16px;
    }
    @media (prefers-color-scheme:light){
      :root{
        --bg:#08110f;
        --fg:#f6f1e8;
        --card:#111c18;
        --soft:#182823;

    }
    body{
      max-width:1040px;
      padding:14px 12px calc(96px + env(safe-area-inset-bottom));
      background:
        linear-gradient(135deg,#08110f 0%,#10221d 42%,#0b1614 100%);
      letter-spacing:0;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(217,173,85,.10),transparent 34%),
        repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 72px);
      opacity:.9;

    h1{
      font-size:1.42rem;

      margin:6px 0 14px;
      color:#fff7e8;
      text-shadow:0 12px 34px rgba(0,0,0,.42);
    }
    h2,h3{color:#fff8ea;font-weight:900}
    .topbar{
      top:0;
      margin:-14px -12px 12px;
      padding:16px 12px 12px;
      background:linear-gradient(180deg,rgba(8,17,15,.98),rgba(8,17,15,.84) 78%,transparent);
      backdrop-filter:blur(18px);

    .tabs{
      max-width:760px;

      background:rgba(255,255,255,.055);

    }
    .tab-btn{
      min-height:46px;
      border-radius:13px;

      font-size:.86rem;
      transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
    }

      color:#102019;
      background:linear-gradient(135deg,#f5d990,#d9ad55);
      box-shadow:0 10px 26px rgba(217,173,85,.28);
    }
    .tab-btn:active,.btn:active{transform:translateY(1px) scale(.99)}
    .card{
      padding:16px;
      margin:12px 0;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.045));
      border-color:rgba(255,255,255,.13);

      border-color:rgba(255,255,255,.13);

    input::placeholder{color:#6f7d74}

      background:linear-gradient(135deg,#f3d68d,#d6a13f);

    }

    .pill.ok{color:var(--ok);background:rgba(65,214,160,.10)}
    .pill.err{color:#ff9a9a;background:rgba(255,107,107,.10)}
    .worker-card,.result-card,.day-card,.employee-card,.alert-card,.summary-card{
      border-radius:16px;
      background:rgba(6,14,12,.58);
      border-color:rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }
    .worker-card,.employee-card,.day-card,.summary-card{transition:transform .16s ease,border-color .16s ease,background .16s ease}
    .worker-card:hover,.employee-card:hover,.day-card:hover,.summary-card:hover{

      border-color:rgba(217,173,85,.34);
      background:rgba(13,27,23,.74);
    }

      border-radius:16px;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));

    }

    .kpi b{color:#fff8ea;font-weight:950}

      background:linear-gradient(135deg,rgba(65,214,160,.20),rgba(217,173,85,.16));

    }

    .metric{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.055);
    }
    .outlier-high{border-right-color:var(--ok)}
    .outlier-low{border-right-color:var(--err)}
    .fab{
      left:12px;
      right:12px;
      bottom:12px;
      gap:10px;
      padding:8px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      background:rgba(8,17,15,.78);
      backdrop-filter:blur(18px);
      box-shadow:0 18px 48px rgba(0,0,0,.38);

    @media (min-width:780px){

    /* Zedef event-form inspired refresh */
    :root{

      --bg:#f5f7fb;
      --fg:#202124;
      --card:#ffffff;
      --soft:#f7f2e6;
      --muted:#667085;
      --accent:#273149;
      --accent-soft:rgba(184,154,90,.16);
      --ok:#2e7d32;
      --warn:#b7791f;
      --err:#b42318;
      --border:#e4dbc4;
      --input-bg:#fffdf8;
      --input-fg:#202124;
      --focus:rgba(184,154,90,.18);

      --touch:54px;
      --shadow:0 18px 45px rgba(23,28,42,.16);

    html{background:var(--navy-deep)}

        linear-gradient(rgba(23,28,42,.80),rgba(23,28,42,.84)),
        url("https://media.base44.com/images/public/6a01bc0bf7391ac07f7a853e/1c19139d1_0R4A0647.jpg");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;

    body::before{

        linear-gradient(180deg,rgba(255,255,255,.04),transparent 220px);

    .topbar{

      content:"";

      height:58px;
      border-radius:50%;
      background:#c5a96a url("https://media.base44.com/images/public/6a01bc0bf7391ac07f7a853e/b2bf014df_aa7637b2-8d58-44c2-a4e9-91c7f3430ac8.jpg") center/cover;

    h1::after{
      display:none;
    }
    h2,h3{
      color:var(--navy);
      font-family:"Heebo","Assistant",sans-serif;
      font-weight:900;
      letter-spacing:0;
    }
    .tabs{
      max-width:780px;

    }
    .card{

    .section-head{
      margin:-18px -18px 16px;

      border:0;
      border-bottom:1px solid rgba(184,154,90,.35);

        linear-gradient(90deg,rgba(184,154,90,.18),transparent 60%),

    .section-head h2{

    label{
      color:var(--navy);

    }
    input[type="text"],input[type="number"],input[type="date"],input[type="month"],select,textarea{
      min-height:var(--touch);
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--input-bg);
      color:var(--input-fg);
      box-shadow:none;
      font-family:"Assistant",Arial,sans-serif;
    }
    input::placeholder{color:#9aa0aa}
    input:focus,select:focus,textarea:focus{
      border-color:var(--gold);
      background:#fff;
      box-shadow:0 0 0 4px var(--focus);
    }
    input[type="checkbox"],input[type="radio"]{
      accent-color:var(--gold);
    }
    .btn{
      min-height:var(--touch);
      border-radius:999px;
      color:#fff;
      background:linear-gradient(135deg,var(--gold),var(--gold-dark));
      box-shadow:0 12px 26px rgba(143,113,53,.24);
      font-weight:900;
    }
    .btn.secondary{
      color:var(--navy);
      background:#eef1f7;
      border:1px solid #dce1ea;
      box-shadow:none;
    }
    .btn.danger{
      color:var(--err);
      background:#fff0ea;
      border:1px solid rgba(180,35,24,.24);
      box-shadow:none;
    }
    .btn.small{
      min-height:38px;
      padding-inline:14px;
      font-size:.9rem;
    }
    .btn.icon{
      width:40px;
      min-width:40px;
      min-height:40px;
      border-radius:50%;
      padding:0;
    }
    .pill{
      color:var(--gold-dark);
      background:var(--gold-soft);
      border:1px solid rgba(184,154,90,.45);
      font-weight:800;
    }
    .pill.ok{
      color:var(--ok);
      background:#eef8ef;
      border-color:rgba(46,125,50,.22);
    }
    .pill.err{
      color:var(--err);
      background:#fff0ea;
      border-color:rgba(180,35,24,.22);
    }
    .switch-label,
    .toggle-label{
      color:var(--navy);
      font-weight:800;
    }
    .worker-card,.result-card,.day-card,.employee-card,.alert-card,.summary-card{
      background:#fff;
      border:1px solid #e5dece;
      border-radius:13px;
      box-shadow:none;
    }
    .worker-card:hover,.employee-card:hover,.day-card:hover,.summary-card:hover{

      border-color:rgba(184,154,90,.62);

      box-shadow:0 8px 22px rgba(39,49,73,.08);

    .worker-title,.employee-title,.day-title,.summary-title,

    .muted,.employee-sub,.worker-sub,.day-sub,.summary-sub{

    .kpi{

    .metric{

    }
    .stars-wrap{

function normalizeShift(value){
  const v=String(value||'').trim().toLowerCase();

function loadJson(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}

function persist(){saveJson(LS_EMPLOYEES,employees);saveJson(LS_DAYS,days);saveJson(LS_CLOSED,closedMonths);saveJson(LS_DELETED_DAYS,deletedDays);queueCloudSave()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function cloudConfigured(){return !!(CLOUD_CONFIG.supabaseUrl&&CLOUD_CONFIG.supabaseAnonKey&&window.supabase)}
function setCloudStatus(text,mode=''){const el=document.getElementById('cloudStatus');if(!el)return;el.textContent=text;el.className='pill cloud-pill '+mode}
function appData(){return {employees,days,closedMonths,deletedDays,version:10,updatedAt:new Date().toISOString()}}
function hasUsefulData(data){return !!(data&&(data.employees?.length||data.days?.length||data.closedMonths?.length))}
function recordTime(item){return Date.parse(item?.updatedAt||item?.createdAt||item?.closedAt||0)||0}
function newestRecord(a,b){return recordTime(b)>=recordTime(a)?b:a}
function mergeByKey(remoteList=[],localList=[],keyFn){
  const map=new Map();
  (Array.isArray(remoteList)?remoteList:[]).forEach(item=>{const key=keyFn(item);if(key)map.set(key,item)});
  (Array.isArray(localList)?localList:[]).forEach(item=>{
    const key=keyFn(item);
    if(!key)return;
    map.set(key,map.has(key)?newestRecord(map.get(key),item):item);
  });
  return [...map.values()];
}
function mergeClosedMonths(remoteList=[],localList=[]){return mergeByKey(remoteList,localList,m=>String(m?.month||''))}
function mergeAppData(remoteData={},localData={}){
  const mergedDeletedDays=mergeByKey(remoteData.deletedDays,localData.deletedDays,d=>String(d?.id||''));
  const deletedIds=new Set(mergedDeletedDays.map(d=>String(d.id||'')));
  const mergedDays=mergeByKey(remoteData.days,localData.days,d=>String(d?.id||d?.date||''))
    .filter(d=>!deletedIds.has(String(d?.id||'')));
  return {
    employees:mergeByKey(remoteData.employees,localData.employees,e=>employeeKey(e)||String(e?.id||e?.name||'')),
    days:mergedDays,
    closedMonths:mergeClosedMonths(remoteData.closedMonths,localData.closedMonths),
    deletedDays:mergedDeletedDays,
    version:Math.max(Number(remoteData.version)||0,Number(localData.version)||0,10),
    updatedAt:new Date().toISOString()
  };
}
function applyCloudData(data){
  if(!data||typeof data!=='object')return;
  applyingCloudState=true;
  employees=Array.isArray(data.employees)?data.employees:[];
  days=Array.isArray(data.days)?data.days:[];
  closedMonths=Array.isArray(data.closedMonths)?data.closedMonths:[];
  deletedDays=Array.isArray(data.deletedDays)?data.deletedDays:[];
  saveJson(LS_EMPLOYEES,employees);
  saveJson(LS_DAYS,days);
  saveJson(LS_CLOSED,closedMonths);
  saveJson(LS_DELETED_DAYS,deletedDays);
  migrateData();
  refreshEmployeeLists();
  renderEmployees();
  renderDays();
  renderMonth();
  updateEditStatus();
  checkExistingShift();
  renderReportValidation();
  applyingCloudState=false;
}
async function loadCloudNow({silent=false}={}){
  if(!cloudClient&&cloudConfigured())cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
  if(!cloudClient)return false;
  try{
    const {data,error}=await cloudClient.from('app_state').select('data,updated_by,updated_at').eq('restaurant_id',CLOUD_CONFIG.restaurantId).maybeSingle();
    if(error)throw error;
    if(hasUsefulData(data?.data)){
      applyCloudData(data.data);
      if(!silent)setCloudStatus('מחובר לענן','ok');
      return true;
    }
    return false;
  }catch(err){
    console.error(err);
    if(!silent)setCloudStatus('שגיאת קריאה מהענן','err');
    return false;
  }
}
async function importCloudAndRefresh(){
  setCloudStatus('מייבא נתונים מהענן...');
  const pulled=await loadCloudNow({silent:false});
  if(pulled){
    const active=document.querySelector('.view.active')?.id;
    if(active==='employeesView')renderEmployees();
    if(active==='journalView')renderDays();
    if(active==='monthView')renderMonth();

    setCloudStatus('מחובר לענן','ok');
    toast('הנתונים יובאו ורועננו מהענן');

  }
  setCloudStatus('אין נתונים למשיכה מהענן','warn');
  toast('לא נמצאו נתונים חדשים בענן');

async function manualCloudSync(){
  return importCloudAndRefresh();
}
function startCloudPolling(){
  clearInterval(window.__cloudPollTimer);
  window.__cloudPollTimer=setInterval(()=>{
    if(!document.hidden&&cloudReady)loadCloudNow({silent:true});
  },15000);
}
async function initCloud(){
  if(!cloudConfigured()){setCloudStatus('ענן לא מוגדר');return}
  try{
    cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
    setCloudStatus('מתחבר לענן...');
    const loaded=await loadCloudNow({silent:true});
    if(!loaded){await saveCloudNow();setCloudStatus(hasUsefulData(appData())?'נתונים מקומיים הועלו לענן':'ענן נוצר','ok')}
    cloudReady=true;
    cloudSubscription=cloudClient.channel(`app_state_${CLOUD_CONFIG.restaurantId}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:`restaurant_id=eq.${CLOUD_CONFIG.restaurantId}`},payload=>{
        if(payload.new?.updated_by===cloudClientId)return;
        applyCloudData(payload.new?.data);
        toast('נתונים עודכנו מהענן');
      })
      .subscribe((status)=>{
        if(status==='SUBSCRIBED')setCloudStatus('מחובר לענן · סנכרון חי','ok');
        if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')setCloudStatus('מחובר לענן · ללא סנכרון חי','warn');
      });
    window.addEventListener('focus',()=>loadCloudNow({silent:true}));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadCloudNow({silent:true})});
    startCloudPolling();
  }catch(err){
    console.error(err);
    setCloudStatus('שגיאת ענן','err');
    toast('לא הצלחנו להתחבר לענן');
  }
}
function queueCloudSave(){
  if(applyingCloudState||!cloudReady)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(saveCloudNow,650);
}
async function saveCloudNow(){
  if(!cloudClient&&cloudConfigured())cloudClient=window.supabase.createClient(CLOUD_CONFIG.supabaseUrl,CLOUD_CONFIG.supabaseAnonKey);
  if(!cloudClient){setCloudStatus('ענן לא מוגדר','err');return false}
  try{
    const localSnapshot=appData();
    const {data:remoteRow,error:readError}=await cloudClient.from('app_state').select('data').eq('restaurant_id',CLOUD_CONFIG.restaurantId).maybeSingle();
    if(readError)throw readError;
    const payload=hasUsefulData(remoteRow?.data)?mergeAppData(remoteRow.data,localSnapshot):localSnapshot;
    const {error}=await cloudClient.from('app_state').upsert({restaurant_id:CLOUD_CONFIG.restaurantId,data:payload,updated_by:cloudClientId,updated_at:new Date().toISOString()},{onConflict:'restaurant_id'});
    if(error)throw error;
    if(JSON.stringify(payload)!==JSON.stringify(localSnapshot))applyCloudData(payload);
    setCloudStatus('מחובר לענן','ok');
    return true;
  }catch(err){
    console.error(err);
    setCloudStatus('שגיאת שמירה בענן','err');
    return false;
  }
}
function getEmployeeById(id){const value=String(id||'');if(!value)return null;return employees.find(e=>String(e.id)===value)||null}
function roleText(role){
  // Translate internal role identifiers to Hebrew text. Return empty string when no role.
  if(role==='bar') return 'ברמן';
  if(role==='waiter') return 'מלצר';
  if(role==='both') return 'גם וגם';
  if(role==='host') return 'מארחת';
  if(role==='manager') return 'אחמ״ש';
  return '';
}
function isMonthClosed(month){return closedMonths.some(m=>m.month===month)}
function migrateData(){
  let changed=false;
  const deletedIds=new Set((Array.isArray(deletedDays)?deletedDays:[]).map(d=>String(d.id||'')));
  if(deletedIds.size){const before=days.length;days=days.filter(d=>!deletedIds.has(String(d.id||'')));if(days.length!==before)changed=true}
  employees=employees.map(e=>{
    const next={...e};
    if(!next.uid){next.uid=employeeUid();changed=true}
    if(next.active===undefined){next.active=true;changed=true}
    return next;
  });
  days=days.map(d=>{
    const workers=(d.workers||[]).map(w=>{
      if(w.empUid) return w;
      const match=getEmployeeById(w.empId)||employees.find(e=>String(e.name)===String(w.nameSnapshot||w.name));
      if(match){changed=true;return {...w,empUid:employeeKey(match)}}
      return w;
    });
    const next={...d,workers};
    const normalizedShift=normalizeShift(next.shift);
    if(next.shift!==normalizedShift){next.shift=normalizedShift;changed=true}
    if(next.locked===undefined){next.locked=true;next.editCount=next.editCount||0;changed=true}
    if(next.hostHours===undefined){next.hostHours=roundMoney(workers.filter(w=>w.role==='host').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    if(next.managerHours===undefined){next.managerHours=roundMoney(workers.filter(w=>w.role==='manager').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    return next;
  });
  if(changed)persist();
}

function validateReportForSave(calc=null){
  const checks=[];
  const date=document.getElementById('workDate')?.value||'';
  const shift=getSelectedShift();
  const totalTip=floorMoney(document.getElementById('totalTip')?.value||0);
  const roleData=roleOrder.map(role=>({role,...getShiftWorkers(role,false)}));
  const workers=roleData.flatMap(x=>x.workers);
  const errors=roleData.flatMap(x=>x.errors);
  const seen=new Map();const duplicateNames=[];
  workers.forEach(w=>{const key=w.empUid||w.empId||w.name;if(seen.has(key))duplicateNames.push(w.name);else seen.set(key,w)});
  checks.push({level:date?'ok':'err',text:date?'יש תאריך':'חסר תאריך'});
  checks.push({level:shift?'ok':'err',text:`משמרת: ${shiftText(shift)}`});
  checks.push({level:workers.length?'ok':'err',text:workers.length?`${workers.length} עובדים בדוח`:'לא נוספו עובדים'});
  checks.push({level:totalTip>0?'ok':'err',text:totalTip>0?`סה״כ טיפים ${fmt(totalTip)}`:'חסר סה״כ טיפים'});
  if(errors.length)checks.push(...errors.map(text=>({level:'err',text})));
  if(duplicateNames.length)checks.push({level:'err',text:'עובד מופיע יותר מפעם אחת בדוח: '+[...new Set(duplicateNames)].join(', ')});
  if(!workers.some(w=>w.role==='waiter'))checks.push({level:'err',text:'חסר לפחות מלצר אחד'});
  if(document.getElementById('enableBarCut')?.checked&&!workers.some(w=>w.role==='bar'))checks.push({level:'err',text:'הפרשה לבר פעילה אבל אין ברמן'});
  if(calc?.ok)checks.push({level:'ok',text:'חישוב הטיפים תקין'});
  const ok=!checks.some(c=>c.level==='err');
  return {ok,checks};
}

function saveEmployee(){
  const id = normalizeId(document.getElementById('empId').value);
  const name = document.getElementById('empName').value.trim();
  // derive default role from checkboxes (waiter/bar). allow multiple roles
  const waiter = document.getElementById('empRoleWaiter').checked;
  const bar = document.getElementById('empRoleBar').checked;
  const host = document.getElementById('empRoleHost')?.checked;
  const manager = document.getElementById('empRoleManager')?.checked;
  // determine defaultRole: host/manager take precedence, then waiter+bar, then individual waiter or bar
  let defaultRole = '';
  if (host) defaultRole = 'host';
  else if (manager) defaultRole = 'manager';
  else if (waiter && bar) defaultRole = 'both';
  else if (waiter) defaultRole = 'waiter';
  else if (bar) defaultRole = 'bar';
  else defaultRole = '';
  // set default stars only for waiter/bar roles; hosts and managers ignore star rating (still stored but unused)
  let defaultStars = Number(document.getElementById('empDefaultStars').value) || 6;
  if (defaultRole === 'host' || defaultRole === 'manager') {
    defaultStars = 6;
  }
  const active = document.getElementById('empActive').checked;
  // require only a name; id is optional
  if (!name) {
    toast('חסר שם');
    return;
  }
  // check duplicate id only when id exists
  if (id) {
    const duplicate = employees.find(e => String(e.id) === String(id) && employeeKey(e) !== String(editingEmployeeId));
    if (duplicate) {
      toast('מס׳ עובד כבר קיים');
      return;
    }
  }
  const previous = editingEmployeeId ? getEmployeeByKey(editingEmployeeId) : null;
  const record = {
    uid: previous?.uid || employeeUid(),
    id,
    name,
    defaultRole,
    defaultStars,
    active,
    createdAt: previous?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if (editingEmployeeId) {
    employees = employees.map(e => employeeKey(e) === String(editingEmployeeId) ? record : e);
    editingEmployeeId = null;
  } else {
    employees.push(record);
  }
  employees.sort((a,b) => String(a.name).localeCompare(String(b.name),'he'));
  persist();
  resetEmployeeForm();
  renderEmployees();
  refreshEmployeeLists();
  toast('העובד נשמר');
}

function getShiftWorkers(type,strict=false){
  const rows=[...document.querySelectorAll(`#${type}Container .worker-card`)];

  rows.forEach((row,i)=>{

    if(hours<=0){errors.push(`${emp.name}: חסרות שעות`);return}
    let stars=(type==='bar'||type==='waiter')?(emp.defaultStars||6):6;
    const has=row.querySelector(`input[id^='${type}HasStars']`)?.checked;
    if(has){const sel=row.querySelector(`input[name^='${type}Stars']:checked`);if(sel)stars=Number(sel.value)}
    out.push({role:type,empUid:employeeKey(emp),empId:emp.id||'',name:emp.name,nameSnapshot:emp.name,hours,stars});
  });

  const seen=new Set();

  if(strict&&errors.length)throw new Error(errors.join('\n'));

function calculate(){
  const totalTip = floorMoney(document.getElementById('totalTip').value || 0);
  const date = document.getElementById('workDate').value || todayISO();
  const isWeekend = document.getElementById('isWeekend').checked;
  const enableBarCut = document.getElementById('enableBarCut').checked;
  const barPct = enableBarCut ? (isWeekend ? BAR_WEEKEND : BAR_WEEK) : 0;
  // Collect workers for each role
  const barData = getShiftWorkers('bar', false);
  const waiterData = getShiftWorkers('waiter', false);
  const hostData = getShiftWorkers('host', false);
  const managerData = getShiftWorkers('manager', false);
  const errors = [...barData.errors, ...waiterData.errors, ...hostData.errors, ...managerData.errors];
  const waiters = waiterData.workers;
  const bars = barData.workers;
  const hosts = hostData.workers;
  const managers = managerData.workers;
  const waiterHours = waiters.reduce((s, w) => s + w.hours, 0);
  if (totalTip <= 0) errors.push('חסר סה״כ טיפים');
  // Require at least one waiter for distribution; hosts/managers do not count for this validation
  if (waiters.length === 0) errors.push('חסר לפחות מלצר אחד');
  if (enableBarCut && bars.length === 0) errors.push('הפרשה לבר פעילה אבל אין ברמן במשמרת');
  if (errors.length) return { ok: false, errors };
  const barTip = floorMoney(totalTip * barPct);
  const remaining = totalTip - barTip;
  // Determine restaurant percentage based on hourly pay after restaurant cut
  let restPct = 0.15;
  const avgWith = p => (remaining * (1 - p)) / waiterHours;
  if (avgWith(0.20) >= 100) restPct = 0.20;
  else if (avgWith(0.17) >= 90) restPct = 0.17;
  const restCut = floorMoney(remaining * restPct);
  const finalForWaiters = floorMoney(remaining - restCut);
  // Compute pays for waiters
  const effWaiters = waiters.reduce((s, w) => s + w.hours * w.stars, 0);
  const perWaiter = effWaiters ? finalForWaiters / effWaiters : 0;
  const waiterRows = waiters.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perWaiter), rate: w.hours ? floorMoney((w.hours * w.stars * perWaiter) / w.hours) : 0 }));
  // Compute pays for bartenders
  const effBar = bars.reduce((s, w) => s + w.hours * w.stars, 0);
  const perBar = effBar ? barTip / effBar : 0;
  const barRows = bars.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perBar), rate: w.hours ? floorMoney((w.hours * w.stars * perBar) / w.hours) : 0 }));
  // Hosts and managers do not receive tips; assign zero pay and rate
  const hostRows = hosts.map(w => ({ ...w, pay: 0, rate: 0 }));
  const managerRows = managers.map(w => ({ ...w, pay: 0, rate: 0 }));
  const avgHourly = waiterHours ? finalForWaiters / waiterHours : 0;
  return {
    ok: true,
    date,
    totalTip,
    isWeekend,
    enableBarCut,
    barPct,
    barTip,
    restPct,
    restCut,
    finalForWaiters,
    avgHourly: floorMoney(avgHourly),
    waiterHours: roundMoney(waiterHours),
    barHours: roundMoney(bars.reduce((s, w) => s + w.hours, 0)),
    hostHours: roundMoney(hosts.reduce((s, w) => s + w.hours, 0)),

function resolveDuplicateDaySave(calc,shift){

function renderAlerts(md){const alerts=buildAlerts(md);document.getElementById('monthAlerts').innerHTML=alerts.length?`<div class="divider"></div><h3>בדיקת חודש</h3>${alerts.map(a=>`<div class="alert-card"><b class="${a.level==='err'?'danger-text':'warn-text'}">${escapeHTML(a.title)}</b><div class="muted">${escapeHTML(a.detail)}</div></div>`).join('')}`:'<div class="alert-card"><b class="ok-text">לא נמצאו חריגות משמעותיות</b></div>'}
function buildAlerts(md,month=''){
  const alerts=[];
  const byDate={};
  if(!md.length){
    alerts.push({level:'err',title:'אין ימים שמורים בחודש',detail:month||'החודש הנבחר'});
    return alerts;
  }
  md.forEach(d=>{
    const dateShiftKey=`${d.date}|${normalizeShift(d.shift)}`;
    byDate[dateShiftKey]=(byDate[dateShiftKey]||0)+1;
    // No tip total on this day
    if(!d.totalTip) alerts.push({level:'err',title:'משמרת עם 0 טיפים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing waiters on this day
    if(!(d.workers||[]).some(w=>w.role==='waiter')) alerts.push({level:'err',title:'משמרת ללא מלצרים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing bartenders on this day
    if(!(d.workers||[]).some(w=>w.role==='bar')) alerts.push({level:'warn',title:'משמרת ללא ברמנים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Hourly rate out of reasonable range
    if(d.avgHourly>180 || d.avgHourly<30) alerts.push({level:'warn',title:'ש״ש חריג',detail:`${d.date} · ${shiftText(d.shift)} · ${fmt(d.avgHourly)}`});
    // Check each worker
    (d.workers||[]).forEach(w=>{
      // Employee ID is optional; do not alert on missing employee ID
      // Only alert for zero hours
      if(!w.hours) alerts.push({level:'warn',title:'עובד עם 0 שעות',detail:`${d.date} · ${shiftText(d.shift)} · ${w.name}`});
    });
  });
  // Look for duplicate dates
  Object.entries(byDate).forEach(([key,count])=>{
    if(count>1){const [date,shift]=key.split('|');alerts.push({level:'err',title:'כפילות משמרת',detail:`${date} · ${shiftText(shift)} · ${count} רשומות`});}
  });
  return alerts;
}
function toggleMonthClosed(){const m=document.getElementById('monthPicker').value||monthISO();if(isMonthClosed(m)){if(!confirm('לפתוח את החודש לעריכה?'))return;closedMonths=closedMonths.filter(x=>x.month!==m);toast('החודש נפתח לעריכה')}else{const alerts=buildAlerts(currentMonthDays(),m);if(alerts.some(a=>a.level==='err')&&!confirm('יש חריגות חמורות. לסגור בכל זאת?'))return;closedMonths.push({month:m,closedAt:new Date().toISOString()});toast('החודש נסגר')}persist();renderMonth()}
function printMonthReport(){const m=document.getElementById('monthPicker').value||monthISO();const md=currentMonthDays();const macro=makeMonthMacro(md);const workers=monthWorkerSummary(md,'all').sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));const alerts=buildAlerts(md);document.getElementById('printArea').innerHTML=`<h1>דוח טיפים חודשי · ${escapeHTML(m)}</h1><div class="print-grid"><div>משמרות שמורות: <b>${macro.days}</b></div><div>סה״כ טיפים: <b>${fmt(macro.totalTip)}</b></div><div>נטו מלצרים: <b>${fmt(macro.finalForWaiters)}</b></div><div>לבר: <b>${fmt(macro.barTip)}</b></div><div>למסעדה: <b>${fmt(macro.restCut)}</b></div><div>שעות מלצרים: <b>${roundMoney(macro.waiterHours)}</b></div><div>שעות ברמנים: <b>${roundMoney(macro.barHours)}</b></div><div>שעות מארחות: <b>${roundMoney(macro.hostHours)}</b></div><div>שעות אחמ״ש: <b>${roundMoney(macro.managerHours)}</b></div></div><h2>פירוט עובדים</h2>${workers.map(w=>`<div class="summary-card"><b>${escapeHTML(w.name)} · ${escapeHTML(w.empId)} · ${roleText(w.role)}</b><div>שעות: ${roundMoney(w.hours)} · טיפים: ${fmt(w.pay)} · ש״ש: ${fmt(w.hours?w.pay/w.hours:0)}</div></div>`).join('')}<h2>חריגות</h2>${alerts.length?alerts.map(a=>`<div>${escapeHTML(a.title)} · ${escapeHTML(a.detail)}</div>`).join(''):'<div>לא נמצאו חריגות.</div>'}`;window.print()}

function toCsv(rows){return rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
function downloadText(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
function exportAllDaysCsv(){const rows=[['date','shift','copy','role','employee_uid','employee_id','name','hours','stars','pay','rate','total_tip','avg_hourly']];days.forEach(d=>(d.workers||[]).forEach(w=>rows.push([d.date,shiftText(d.shift),d.copyNo||0,w.role,w.empUid||'',w.empId,w.nameSnapshot||w.name,w.hours,w.stars,w.pay,w.rate,d.totalTip,d.avgHourly])));downloadText('tip_journal.csv','\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportMonthCsv(){const m=document.getElementById('monthPicker').value||monthISO();const rows=[['month','role','employee_uid','employee_id','name','hours','pay','avg_rate','days']];monthWorkerSummary(currentMonthDays(),'all').forEach(w=>rows.push([m,w.role,w.empUid||'',w.empId,w.name,roundMoney(w.hours),floorMoney(w.pay),floorMoney(w.hours?w.pay/w.hours:0),w.days.size]));downloadText(`tip_month_${m}.csv`,'\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportAlertsCsv(){const m=document.getElementById('monthPicker').value||monthISO();const rows=[['month','level','title','detail']];buildAlerts(currentMonthDays()).forEach(a=>rows.push([m,a.level,a.title,a.detail]));downloadText(`tip_alerts_${m}.csv`,'\ufeff'+toCsv(rows),'text/csv;charset=utf-8')}
function exportBackupJson(){const backup={version:5,exportedAt:new Date().toISOString(),employees,days,closedMonths};downloadText(`tipcalc_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(backup,null,2),'application/json;charset=utf-8')}
function previewImportFile(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.employees)||!Array.isArray(data.days))throw new Error('bad');pendingImport=data;const months=[...new Set(data.days.map(d=>monthOfDate(d.date)).filter(Boolean))].join(', ');document.getElementById('importPreview').innerHTML=`<div class="alert-card"><b>תצוגה מקדימה</b><div class="muted">עובדים: ${data.employees.length} · ימים: ${data.days.length} · חודשים: ${escapeHTML(months||'אין')}</div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="applyImport('merge')">מזג עם הקיים</button><button class="btn danger" onclick="applyImport('replace')">החלף הכול</button><button class="btn secondary" onclick="clearImportPreview()">בטל</button></div></div>`}catch{toast('קובץ גיבוי לא תקין')}};reader.readAsText(file)}
function applyImport(mode){if(!pendingImport)return;if(mode==='replace'&&!confirm('להחליף את כל הנתונים הקיימים?'))return;if(mode==='replace'){employees=pendingImport.employees||[];days=pendingImport.days||[];closedMonths=pendingImport.closedMonths||[]}else{const empMap=new Map(employees.map(e=>[employeeKey(e),e]));(pendingImport.employees||[]).forEach(e=>{const key=employeeKey(e)||String(e.id||e.name||employeeUid());empMap.set(key,{...empMap.get(key),...e})});employees=[...empMap.values()];const dayMap=new Map(days.map(d=>[String(d.id),d]));(pendingImport.days||[]).forEach(d=>dayMap.set(String(d.id),d));days=[...dayMap.values()];const monthMap=new Map(closedMonths.map(m=>[m.month,m]));(pendingImport.closedMonths||[]).forEach(m=>monthMap.set(m.month,m));closedMonths=[...monthMap.values()]}migrateData();persist();pendingImport=null;clearImportPreview();refreshEmployeeLists();renderEmployees();renderDays();renderMonth();toast('הייבוא הושלם')}
function clearImportPreview(){pendingImport=null;const preview=document.getElementById('importPreview');if(preview)preview.innerHTML='';const file=document.getElementById('backupFile');if(file)file.value=''}
</script>

<script id="hatzedef-clean-production-js">
(function(){
  function cleanCopy(){
    var exact = new Set(["שעות וטיפים","שעות בלבד","שעות בלבד בלי טיפים","הזן סכום טיפים לחלוקה","בדוק את הנתונים לפני שמירה","מלא את פרטי המשמרת וצוות העובדים","ייבוא צוות מדוח קודם"]);
    document.querySelectorAll("p,small,span,div,label").forEach(function(el){
      if(el.children.length > 1) return;
      var t = (el.textContent || "").trim().replace(/\s+/g," ");
      if(exact.has(t)) el.remove();
    });
    var h1 = document.querySelector("h1");
    if(h1) h1.setAttribute("aria-label","הצדף");
  }
  if(document.readyState === "loading"){document.addEventListener("DOMContentLoaded", cleanCopy);} else {cleanCopy();}
})();
</script>
