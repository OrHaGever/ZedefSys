
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>הצדף | חלוקת טיפים</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&family=Heebo:wght@400;700;800;900&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==================================================================
      PREMIUM LUXURY DARK & GOLD THEME REFRESH (UI/UX VERSION V3.0)
      ==================================================================
    */
    :root {
      --bg: #0b0d12 !important;
      --fg: #f4f0e8 !important;
      --card: rgba(24, 26, 33, 0.75) !important;
      --soft: rgba(255, 255, 255, 0.035) !important;
      --muted: #8f95a0 !important;
      --accent: #d6a84f !important;
      --accent-soft: rgba(214, 168, 79, 0.14) !important;
      
      --ok: #10b981 !important;
      --warn: #f59e0b !important;
      --err: #ef4444 !important;
      --border: rgba(255, 255, 255, 0.08) !important;
      --line: rgba(255, 255, 255, 0.07) !important;
      --line-strong: rgba(255, 255, 255, 0.14) !important;
      
      --input-bg: #13161c !important;
      --input-fg: #ffffff !important;
      --focus: rgba(214, 168, 79, 0.25) !important;
      
      --radius: 22px !important;
      --touch: 54px !important;
      --gap: 16px !important;
      
      /* Gold Accents Additional Palette */
      --gold-1: #d6a84f !important;
      --gold-2: #f0c76b !important;
      --gold-dark: #9b6f26 !important;
      --text-gold: #f3dfba !important;
    }

    /* עיצוב כללי של הדף והרקע החלקלק */
    html {
      background: #0d0f14 !important;
    }
    
    body {
      margin: 0 auto !important;
      width: 100% !important;
      max-width: 500px !important; /* אופטימיזציה למובייל יוקרתי */
      min-height: 100svh !important;
      padding: 0 14px calc(100px + env(safe-area-inset-bottom)) !important;
      color: var(--fg) !important;
      font-family: "Assistant", "Heebo", sans-serif !important;
      background: 
        radial-gradient(circle at 50% -8%, rgba(214, 168, 79, 0.15), transparent 35%),
        radial-gradient(circle at 15% 25%, rgba(93, 128, 255, 0.06), transparent 25%),
        linear-gradient(180deg, #101219 0%, #07080b 100%) !important;
      font-size: 15px !important;
      line-height: 1.35 !important;
      overflow-x: hidden !important;
      -webkit-font-smoothing: antialiased;
    }

    /* כותרת עליונה קבועה עם אפקט טשטוש זכוכית */
    .topbar {
      position: sticky !important;
      top: 0 !important;
      z-index: 100 !important;
      margin: 0 -14px 14px !important;
      padding: 16px 14px 10px !important;
      background: linear-gradient(180deg, rgba(13, 15, 20, 0.96), rgba(13, 15, 20, 0.85) 75%, transparent) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }
    
    .topbar h1 {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      margin: 0 4px 12px !important;
      color: #ffffff !important;
      font-size: 21px !important;
      font-weight: 900 !important;
      text-align: right !important;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    
    /* הוספת לוגו/אלמנט גרפי עגול ויוקרתי בצד הכותרת כמו באפליקציות פרימיום */
    .topbar h1:after {
      content: "" !important;
      display: inline-flex !important;
      width: 36px !important;
      height: 36px !important;
      border-radius: 14px !important;
      background: linear-gradient(145deg, var(--gold-2), var(--gold-dark)) !important;
      box-shadow: 0 8px 20px rgba(214, 168, 79, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* טאבים עליונים של הניווט (תפריט עגול צף) */
    .tabs {
      display: grid !important;
      grid-template-columns: repeat(5, 1fr) !important;
      gap: 4px !important;
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid var(--line) !important;
      border-radius: 999px !important;
      padding: 4px !important;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.2) !important;
    }
    
    .tab-btn {
      min-height: 42px !important;
      border: 0 !important;
      border-radius: 999px !important;
      background: transparent !important;
      color: var(--muted) !important;
      font-weight: 700 !important;
      font-size: 0.8rem !important;
      padding: 0 2px !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, var(--gold-2), var(--gold-1)) !important;
      color: #0b0d12 !important;
      box-shadow: 0 8px 18px rgba(214, 168, 79, 0.28) !important;
      font-weight: 900 !important;
    }

    /* כרטיסיות (Cards) בעיצוב זכוכית כהה מושלם */
    .card, .worker-card, .result-card, .day-card, .employee-card, .alert-card, .summary-card {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      padding: 16px !important;
      margin: 12px 0 !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
    }

    /* כותרות פנימיות */
    h2, h3, .worker-title, .employee-title, .day-title, .summary-title, .result-card .name {
      color: var(--text-gold) !important;
      font-weight: 800 !important;
    }
    
    .section-head {
      border-bottom: 1px solid var(--line) !important;
      padding-bottom: 10px !important;
      margin-bottom: 12px !important;
    }

    /* תוויות ושדות קלט אלגנטיים */
    label {
      font-size: 0.88rem !important;
      font-weight: 700 !important;
      color: var(--muted) !important;
      margin-bottom: 6px !important;
    }

    input[type="text"], input[type="number"], input[type="date"], input[type="month"], select, textarea {
      background: var(--input-bg) !important;
      color: var(--input-fg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 14px !important;
      min-height: 50px !important;
      padding: 10px 14px !important;
      transition: all 0.2s ease !important;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px var(--focus) !important;
    }
    
    input::placeholder {
      color: rgba(255, 255, 255, 0.25) !important;
    }

    /* כפתורים פרימיום מוזהבים ומוארים */
    .btn, button:not(.tab-btn) {
      min-height: 50px !important;
      border: 0 !important;
      border-radius: 999px !important;
      background: linear-gradient(135deg, var(--gold-2), var(--gold-1)) !important;
      color: #0b0d12 !important;
      font-weight: 900 !important;
      box-shadow: 0 10px 25px rgba(214, 168, 79, 0.22) !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    
    .btn:active, button:not(.tab-btn):active {
      transform: scale(0.97) !important;
      opacity: 0.95 !important;
    }

    /* כפתורים משניים וכפתורי סכנה */
    .btn.secondary, button.secondary {
      background: rgba(255, 255, 255, 0.06) !important;
      color: #ffffff !important;
      border: 1px solid var(--line-strong) !important;
      box-shadow: none !important;
    }

    .btn.danger, button.danger {
      background: rgba(239, 68, 68, 0.15) !important;
      color: #fc8181 !important;
      border: 1px solid rgba(239, 68, 68, 0.3) !important;
      box-shadow: none !important;
    }
    
    .btn.small {
      min-height: 36px !important;
      padding: 0 14px !important;
      font-size: 0.85rem !important;
    }

    /* קוביות KPI (מדדים חזותיים) */
    .kpi {
      background: rgba(255, 255, 255, 0.025) !important;
      border: 1px solid var(--line) !important;
      border-radius: 16px !important;
      padding: 12px !important;
    }
    
    .hero-kpi {
      background: linear-gradient(135deg, rgba(214, 168, 79, 0.15), rgba(255, 255, 255, 0.02)) !important;
      border-color: rgba(214, 168, 79, 0.25) !important;
    }
    
    .kpi span { color: var(--muted) !important; font-weight: 700 !important; }
    .kpi b { color: #ffffff !important; font-weight: 900 !important; }
    .hero-kpi b { color: var(--gold-2) !important; }

    /* תגיות סטטוס ורדיו צ'יפים */
    .pill, .radio-chip {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid var(--line) !important;
      color: var(--fg) !important;
      border-radius: 999px !important;
    }
    
    .radio-chip:has(input:checked) {
      background: var(--accent-soft) !important;
      border-color: var(--accent) !important;
      color: var(--gold-2) !important;
    }

    .pill.ok, .ok-text { color: var(--ok) !important; }
    .pill.err, .danger-text { color: var(--err) !important; }
    .warn-text { color: var(--warn) !important; }

    /* בר ניווט תחתון/צף קבוע (FAB Container) */
    .fab {
      position: fixed !important;
      left: 14px !important;
      right: 14px !important;
      bottom: calc(12px + env(safe-area-inset-bottom)) !important;
      z-index: 90 !important;
      padding: 8px !important;
      background: rgba(18, 20, 26, 0.88) !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: 20px !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      box-shadow: 0 16px 45px rgba(0,0,0,0.5) !important;
    }

    /* התראות Toast צפות */
    .toast {
      bottom: calc(85px + env(safe-area-inset-bottom)) !important;
      background: #1c1f26 !important;
      color: #ffffff !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: 14px !important;
      box-shadow: 0 14px 40px rgba(0,0,0,0.4) !important;
    }

    /* רשימות השלמה אוטומטית (Suggestions Dropdown) */
    .suggestions {
      background: #161920 !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: 14px !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5) !important;
    }
    
    .suggestion-item:hover, .suggestion-item:focus {
      background: rgba(214, 168, 79, 0.12) !important;
    }

    /* חלונות מודאלים צצים (Modals) */
    .shift-modal-backdrop {
      background: rgba(7, 8, 11, 0.75) !important;
      backdrop-filter: blur(6px) !important;
      -webkit-backdrop-filter: blur(6px) !important;
    }
    
    .shift-modal {
      background: #14171f !important;
      border: 1px solid var(--line-strong) !important;
      border-radius: 24px !important;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6) !important;
    }

    /* התאמות עימוד קלות למובייל */
    .grid { gap: 10px !important; }
    .divider { background: var(--line) !important; }
    
    @media (max-width: 430px) {
      body { padding-inline: 12px !important; }
      .tab-btn { font-size: 0.74rem !important; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>הצדף</h1>
    <div class="cloud-row"><div id="cloudStatus" class="pill cloud-pill">מתחבר לענן...</div><button class="btn secondary sync-now-btn" onclick="importCloudAndRefresh()">רענון נתונים</button></div>
      <nav class="tabs" aria-label="ניווט">
        <!-- Each tab now includes a small icon to visually convey its purpose. The icon appears after the Hebrew label so that in RTL layout it
             sits on the left side. -->
        <button class="tab-btn active" data-view="calcView" onclick="showView('calcView')">משמרת<span class="icon">📋</span></button>
        <button class="tab-btn" data-view="employeesView" onclick="showView('employeesView')">עובדים<span class="icon">👥</span></button>
        <button class="tab-btn" data-view="journalView" onclick="showView('journalView')">יומן<span class="icon">📖</span></button>
        <button class="tab-btn" data-view="monthView" onclick="showView('monthView')">חודש<span class="icon">🗓️</span></button>
      </nav>
  </div>

  <main>
    <section id="calcView" class="view active">
      <div class="card report-card">
        <div class="section-head report-head"><div><h2>דוח משמרת</h2></div></div>
        <div id="editStatus" class="pill hidden" style="margin-bottom:10px"></div>
        <div class="grid report-meta-grid">
          <div><label for="workDate">תאריך</label><input id="workDate" type="date"></div>
          <div>
            <label>משמרת</label>
            <div class="shift-toggle" role="group" aria-label="בחירת משמרת">
              <button type="button" class="shift-choice" data-shift-choice="morning" onclick="setSelectedShift('morning')">בוקר</button>
              <button type="button" class="shift-choice active" data-shift-choice="evening" onclick="setSelectedShift('evening')">ערב</button>
            </div>
          </div>
        </div>
        <div class="status-strip">
          <span id="reportStatusChip" class="status-chip warn">טיוטה</span>
          <span id="shiftExistsChip" class="status-chip">בודק משמרת</span>
        </div>
        <div class="report-actions">
          <button type="button" class="btn secondary small" onclick="openCopyPreviousModal()">העתק ממשמרת קודמת</button>
        </div>
        <div id="existingShiftBox" class="existing-shift-box"></div>
      </div>

      <div class="card staff-card">
        <div class="section-head"><div><h2>צוות המשמרת</h2></div></div>
        <div class="department-grid">
          <div class="department-panel tip-role">
            <div class="department-title"><div><h3>מלצרים</h3></div><button class="btn secondary small" onclick="toggleCollapse('waiterBody')">פתח/סגור</button></div>
            <div id="waiterBody" class="collapse-body"><div id="waiterContainer"></div><button class="btn secondary add-worker-btn" onclick="addShiftWorker('waiter')">+ הוסף מלצר</button></div>
          </div>
          <div class="department-panel tip-role">
            <div class="department-title"><div><h3>ברמנים</h3></div><button class="btn secondary small" onclick="toggleCollapse('barBody')">פתח/סגור</button></div>
            <div id="barBody" class="collapse-body"><div id="barContainer"></div><button class="btn secondary add-worker-btn" onclick="addShiftWorker('bar')">+ הוסף ברמן</button></div>
          </div>
          <div class="department-panel report-only-role">
            <div class="department-title"><div><h3>מארחות</h3></div><button class="btn secondary small" onclick="toggleCollapse('hostBody')">פתח/סגור</button></div>
            <div id="hostBody" class="collapse-body"><div id="hostContainer"></div><button class="btn secondary add-worker-btn" onclick="addShiftWorker('host')">+ הוסף מארחת</button></div>
          </div>
          <div class="department-panel report-only-role">
            <div class="department-title"><div><h3>אחמ״ש</h3></div><button class="btn secondary small" onclick="toggleCollapse('managerBody')">פתח/סגור</button></div>
            <div id="managerBody" class="collapse-body"><div id="managerContainer"></div><button class="btn secondary add-worker-btn" onclick="addShiftWorker('manager')">+ הוסף אחמ״ש</button></div>
          </div>
        </div>
      </div>

      <div class="card notes-card">
        <div class="section-head"><div><h2>הערות משמרת</h2></div></div>
        <div class="notes-field"><label for="shiftNotes">הערה</label><textarea id="shiftNotes"></textarea></div>
      </div>

      <div class="card tips-card">
        <div class="section-head"><div><h2>מחשבון טיפים</h2></div></div>
        <div class="grid">
          <div><label for="totalTip">סה״כ טיפים</label><input id="totalTip" type="number" min="0" step="0.01" inputmode="decimal" placeholder="2450"></div>
        </div>
        <div class="switch-row">
          <label class="switch-label" for="enableBarCut"><input id="enableBarCut" type="checkbox" checked onchange="toggleWeekendState()"><span class="pill">הפרשה לבר</span></label>
          <label id="weekendWrapper" class="switch-label" for="isWeekend"><input id="isWeekend" type="checkbox"><span class="pill">סופ״ש</span></label>
        </div>
      </div>

      <div id="reportValidation" class="validation-box"></div>

      <div id="calcResults" class="card hidden results-card">
        <div class="section-head"><div><h2>סיכום טיפים</h2></div></div>
        <div id="resultsMacro" class="kpi-grid"></div>
        <div class="divider"></div>
        <h3>מלצרים</h3>
        <div id="waitersResults"></div>
        <div class="divider"></div>
        <h3>ברמנים</h3>
        <div id="barResults"></div>
      </div>
    </section>

    <section id="employeesView" class="view">
      <div class="card">
        <h2>עובדים</h2>
        <div class="grid">
          <div><label for="empId">מס׳ עובד</label><input id="empId" type="text" inputmode="numeric" placeholder="לדוגמה 123"></div>
          <div><label for="empName">שם</label><input id="empName" type="text" placeholder="שם מלא"></div>
          <div>
            <label>תפקידים</label>
            <div class="tight-row">
              <label class="toggle-label"><input id="empRoleWaiter" type="checkbox"> מלצר</label>
              <label class="toggle-label"><input id="empRoleBar" type="checkbox"> ברמן</label>
              <label class="toggle-label"><input id="empRoleHost" type="checkbox"> מארחת</label>
              <label class="toggle-label"><input id="empRoleManager" type="checkbox"> אחמ״ש</label>
            </div>
          </div>
          <div><label for="empDefaultStars">כוכבים</label><select id="empDefaultStars"><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option></select></div>
        </div>
        <div class="switch-row"><label class="switch-label" for="empActive"><input id="empActive" type="checkbox" checked><span class="pill">פעיל</span></label></div>
        <div class="row" style="margin-top:10px"><button id="saveEmployeeBtn" class="btn" onclick="saveEmployee()">שמור עובד</button><button class="btn secondary" onclick="resetEmployeeForm()">נקה</button></div>
      </div>
      <div class="card">
        <div class="grid"><div><label for="employeeSearch">חיפוש עובד</label><input id="employeeSearch" type="text" placeholder="שם או מספר" oninput="renderEmployees()"></div><div><label for="employeeRoleFilter">מחלקה</label><select id="employeeRoleFilter" onchange="renderEmployees()"><option value="all">כל המחלקות</option><option value="waiter">מלצרים</option><option value="bar">בר</option><option value="host">מארחות</option><option value="manager">אחמ״ש</option></select></div><div><label for="employeeFilter">סטטוס</label><select id="employeeFilter" onchange="renderEmployees()"><option value="active">פעילים</option><option value="all">כולם</option><option value="inactive">לא פעילים</option></select></div></div>
        <div id="employeesList"></div>
      </div>
    </section>

    <section id="journalView" class="view">
      <div class="card"><div class="row"><button class="btn secondary" onclick="newDay()">יום חדש</button><button class="btn secondary" onclick="exportAllDaysCsv()">ייצוא יומן CSV</button></div></div>
      <div class="card"><h2>ימים שמורים</h2><div class="day-search-wrap"><label for="daysSearch">חיפוש</label><input id="daysSearch" type="text" placeholder="תאריך, עובד, סכום או משמרת" oninput="renderDays()"></div><div id="daysList"></div></div>
    </section>

    <section id="monthView" class="view">
      <div class="card">
        <div class="grid">
          <div><label for="monthPicker">חודש</label><input id="monthPicker" type="month" onchange="renderMonth()"></div>
          <!-- Removed explicit role filter. Role is always treated as "all" -->
          <!-- <div><label for="roleFilter">סינון</label><select id="roleFilter" onchange="renderMonth()"><option value="all">כולם</option><option value="waiter">מלצרים</option><option value="bar">ברמנים</option></select></div> -->
          <div><label for="monthSearch">חיפוש</label><input id="monthSearch" type="text" placeholder="שם או מס׳ עובד" oninput="renderMonth()"></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn secondary" onclick="exportMonthCsv()">ייצוא חודש CSV</button><button class="btn secondary" onclick="exportAlertsCsv()">ייצוא חריגות CSV</button><button class="btn secondary" onclick="printMonthReport()">דוח להדפסה</button><button id="closeMonthBtn" class="btn danger" onclick="toggleMonthClosed()">סגור חודש</button></div>
      </div>
      <div class="card"><h2>סיכום חודשי</h2><div id="monthStatus" class="pill hidden"></div><div id="monthMacro" class="kpi-grid" style="margin-top:10px"></div><div id="monthRoleSummary" class="month-role-grid"></div><div id="monthAlerts"></div><div id="monthWorkers"></div></div>
    </section>

  </main>

  <div id="copyPreviousModal" class="copy-modal-backdrop hidden" onclick="if(event.target.id==='copyPreviousModal')closeCopyPreviousModal()">
    <div class="copy-modal" role="dialog" aria-modal="true" aria-labelledby="copyPreviousTitle">
      <h3 id="copyPreviousTitle">העתקת נתונים ממשמרת קודמת</h3>
      <p>הנתונים יועתקו אל התאריך והמשמרת שמסומנים עכשיו בדוח.</p>
      <div id="copyPreviousTarget" class="copy-target"></div>
      <label for="copyPreviousSelect">בחר דוח מקור</label>
      <select id="copyPreviousSelect"></select>
      <div class="copy-modal-actions">
        <button type="button" class="btn" onclick="copyPreviousShiftData('all')">העתק הכל</button>

function hasUsefulData(data){return !!(data&&(data.employees?.length||data.days?.length||data.closedMonths?.length))}
function recordTime(item){return Date.parse(item?.updatedAt||item?.createdAt||item?.closedAt||0)||0}
function newestRecord(a,b){return recordTime(b)>=recordTime(a)?b:a}
function mergeByKey(remoteList=[],localList=[],keyFn){
  const map=new Map();
  (Array.isArray(remoteList)?remoteList:[]).forEach(item=>{const key=keyFn(item);if(key)map.set(key,item)});
  (Array.isArray(localList)?localList:[]).forEach(item=>{
    const key=keyFn(item);
    if(!key)return;
    map.set(key,map.has(key)?newestRecord(map.get(key),item):item);
  });
  return [...map.values()];
}
function mergeClosedMonths(remoteList=[],localList=[]){return mergeByKey(remoteList,localList,m=>String(m?.month||''))}
function mergeAppData(remoteData={},localData={}){
  const mergedDeletedDays=mergeByKey(remoteData.deletedDays,localData.deletedDays,d=>String(d?.id||''));
  const deletedIds=new Set(mergedDeletedDays.map(d=>String(d.id||'')));
  const mergedDays=mergeByKey(remoteData.days,localData.days,d=>String(d?.id||d?.date||''))
    .filter(d=>!deletedIds.has(String(d?.id||'')));
  return {
    employees:mergeByKey(remoteData.employees,localData.employees,e=>employeeKey(e)||String(e?.id||e?.name||'')),
    days:mergedDays,
    closedMonths:mergeClosedMonths(remoteData.closedMonths,localData.closedMonths),
    deletedDays:mergedDeletedDays,
    version:Math.max(Number(remoteData.version)||0,Number(localData.version)||0,10),
    updatedAt:new Date().toISOString()
  };
}

function getEmployeeById(id){const value=String(id||'');if(!value)return null;return employees.find(e=>String(e.id)===value)||null}
function roleText(role){
  // Translate internal role identifiers to Hebrew text. Return empty string when no role.
  if(role==='bar') return 'ברמן';
  if(role==='waiter') return 'מלצר';
  if(role==='both') return 'גם וגם';
  if(role==='host') return 'מארחת';
  if(role==='manager') return 'אחמ״ש';
  return '';
}
function isMonthClosed(month){return closedMonths.some(m=>m.month===month)}
function migrateData(){
  let changed=false;
  const deletedIds=new Set((Array.isArray(deletedDays)?deletedDays:[]).map(d=>String(d.id||'')));
  if(deletedIds.size){const before=days.length;days=days.filter(d=>!deletedIds.has(String(d.id||'')));if(days.length!==before)changed=true}
  employees=employees.map(e=>{
    const next={...e};
    if(!next.uid){next.uid=employeeUid();changed=true}
    if(next.active===undefined){next.active=true;changed=true}
    return next;
  });
  days=days.map(d=>{
    const workers=(d.workers||[]).map(w=>{
      if(w.empUid) return w;
      const match=getEmployeeById(w.empId)||employees.find(e=>String(e.name)===String(w.nameSnapshot||w.name));
      if(match){changed=true;return {...w,empUid:employeeKey(match)}}
      return w;
    });
    const next={...d,workers};
    const normalizedShift=normalizeShift(next.shift);
    if(next.shift!==normalizedShift){next.shift=normalizedShift;changed=true}
    if(next.locked===undefined){next.locked=true;next.editCount=next.editCount||0;changed=true}
    if(next.hostHours===undefined){next.hostHours=roundMoney(workers.filter(w=>w.role==='host').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    if(next.managerHours===undefined){next.managerHours=roundMoney(workers.filter(w=>w.role==='manager').reduce((s,w)=>s+Number(w.hours||0),0));changed=true}
    return next;
  });
  if(changed)persist();
}

  const first=matches[0];

}

function allCurrentWorkers(){return roleOrder.flatMap(role=>getShiftWorkers(role,false).workers)}
function validateReportForSave(calc=null){
  const checks=[];
  const date=document.getElementById('workDate')?.value||'';
  const shift=getSelectedShift();
  const totalTip=floorMoney(document.getElementById('totalTip')?.value||0);
  const roleData=roleOrder.map(role=>({role,...getShiftWorkers(role,false)}));
  const workers=roleData.flatMap(x=>x.workers);
  const errors=roleData.flatMap(x=>x.errors);
  const seen=new Map();const duplicateNames=[];
  workers.forEach(w=>{const key=w.empUid||w.empId||w.name;if(seen.has(key))duplicateNames.push(w.name);else seen.set(key,w)});
  checks.push({level:date?'ok':'err',text:date?'יש תאריך':'חסר תאריך'});
  checks.push({level:shift?'ok':'err',text:`משמרת: ${shiftText(shift)}`});
  checks.push({level:workers.length?'ok':'err',text:workers.length?`${workers.length} עובדים בדוח`:'לא נוספו עובדים'});
  checks.push({level:totalTip>0?'ok':'err',text:totalTip>0?`סה״כ טיפים ${fmt(totalTip)}`:'חסר סה״כ טיפים'});
  if(errors.length)checks.push(...errors.map(text=>({level:'err',text})));
  if(duplicateNames.length)checks.push({level:'err',text:'עובד מופיע יותר מפעם אחת בדוח: '+[...new Set(duplicateNames)].join(', ')});
  if(!workers.some(w=>w.role==='waiter'))checks.push({level:'err',text:'חסר לפחות מלצר אחד'});
  if(document.getElementById('enableBarCut')?.checked&&!workers.some(w=>w.role==='bar'))checks.push({level:'err',text:'הפרשה לבר פעילה אבל אין ברמן'});
  if(calc?.ok)checks.push({level:'ok',text:'חישוב הטיפים תקין'});
  const ok=!checks.some(c=>c.level==='err');
  return {ok,checks};
}

function renderReportValidation(calc=null,force=false){
  const el=document.getElementById('reportValidation');

  if(force)reportValidationVisible=true;

  return res;
}

// Automatically set weekend checkbox based on the selected date.
function autoSetWeekend(){
  const dateStr = document.getElementById('workDate').value || '';
  if(!dateStr) return;
  const [year,month,dayOfMonth] = dateStr.split('-').map(Number);
  const d = new Date(year, month - 1, dayOfMonth);
  const day = d.getDay(); // 0 Sunday, 1 Monday, ..., 5 Friday, 6 Saturday
  const weekend = (day === 5 || day === 6);
  // Only update the checkbox if bar cut is enabled; weekend selection is disabled when bar cut is off
  document.getElementById('isWeekend').checked = weekend;
}

function saveEmployee(){
  const id = normalizeId(document.getElementById('empId').value);
  const name = document.getElementById('empName').value.trim();
  // derive default role from checkboxes (waiter/bar). allow multiple roles
  const waiter = document.getElementById('empRoleWaiter').checked;
  const bar = document.getElementById('empRoleBar').checked;
  const host = document.getElementById('empRoleHost')?.checked;
  const manager = document.getElementById('empRoleManager')?.checked;
  // determine defaultRole: host/manager take precedence, then waiter+bar, then individual waiter or bar
  let defaultRole = '';
  if (host) defaultRole = 'host';
  else if (manager) defaultRole = 'manager';
  else if (waiter && bar) defaultRole = 'both';
  else if (waiter) defaultRole = 'waiter';
  else if (bar) defaultRole = 'bar';
  else defaultRole = '';
  // set default stars only for waiter/bar roles; hosts and managers ignore star rating (still stored but unused)
  let defaultStars = Number(document.getElementById('empDefaultStars').value) || 6;
  if (defaultRole === 'host' || defaultRole === 'manager') {
    defaultStars = 6;
  }
  const active = document.getElementById('empActive').checked;
  // require only a name; id is optional
  if (!name) {
    toast('חסר שם');
    return;
  }
  // check duplicate id only when id exists
  if (id) {
    const duplicate = employees.find(e => String(e.id) === String(id) && employeeKey(e) !== String(editingEmployeeId));
    if (duplicate) {
      toast('מס׳ עובד כבר קיים');
      return;
    }
  }
  const previous = editingEmployeeId ? getEmployeeByKey(editingEmployeeId) : null;
  const record = {
    uid: previous?.uid || employeeUid(),
    id,
    name,
    defaultRole,
    defaultStars,
    active,
    createdAt: previous?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if (editingEmployeeId) {
    employees = employees.map(e => employeeKey(e) === String(editingEmployeeId) ? record : e);
    editingEmployeeId = null;
  } else {
    employees.push(record);
  }
  employees.sort((a,b) => String(a.name).localeCompare(String(b.name),'he'));
  persist();
  resetEmployeeForm();
  renderEmployees();
  refreshEmployeeLists();
  toast('העובד נשמר');
}
function editEmployee(id){
  const e = getEmployeeByKey(id);
  if (!e) return;
  editingEmployeeId = employeeKey(e);
  document.getElementById('empId').value = e.id || '';
  document.getElementById('empName').value = e.name || '';
  // set role checkboxes based on defaultRole
  const role = e.defaultRole || '';

function employeesForRole(role){

    if(role==='bar') return r==='bar'||r==='both'||r==='';

  });
}

function parseEmployeeInput(value,rowOrInput=null,type=''){

function applyEmployeeDefaults(type,id){const input=document.getElementById(`${type}Emp${id}`);const emp=parseEmployeeInput(input.value,input,type);if(!emp)return;const has=document.getElementById(`${type}HasStars${id}`);const options=document.getElementById(`${type}StarsOptions${id}`);const star=Number(emp.defaultStars)||6;if(star!==6&&has&&options){has.checked=true;options.style.display='flex'}document.querySelectorAll(`input[name="${type}Stars${id}"]`).forEach(r=>r.checked=Number(r.value)===star)}
function toggleStars(type,id){const box=document.getElementById(`${type}StarsOptions${id}`);box.style.display=getComputedStyle(box).display==='none'?'flex':'none'}
function getShiftWorkers(type,strict=false){
  const rows=[...document.querySelectorAll(`#${type}Container .worker-card`)];
  const out=[];
  const errors=[];
  rows.forEach((row,i)=>{
    const input=row.querySelector(`input[data-worker-role="${type}"]`);
    const emp=parseEmployeeInput(input?.value,row,type);
    let hours=Number(row.querySelector(`input[id^='${type}Hours']`)?.value||0);
    hours=Math.min(Math.max(hours,0),24);
    if(!input?.value.trim()&&!hours)return;
    if(!emp){errors.push(`${roleText(type)||'עובד'} ${i+1}: עובד לא קיים ברשימת העובדים או שהשם כפול`);return}
    if(hours<=0){errors.push(`${emp.name}: חסרות שעות`);return}
    let stars=(type==='bar'||type==='waiter')?(emp.defaultStars||6):6;
    const has=row.querySelector(`input[id^='${type}HasStars']`)?.checked;
    if(has){const sel=row.querySelector(`input[name^='${type}Stars']:checked`);if(sel)stars=Number(sel.value)}
    out.push({role:type,empUid:employeeKey(emp),empId:emp.id||'',name:emp.name,nameSnapshot:emp.name,hours,stars});
  });
  const dup=new Set();
  const seen=new Set();
  out.forEach(w=>{const key=w.role+'|'+(w.empUid||w.empId||w.name);if(seen.has(key))dup.add(w.name);seen.add(key)});
  if(dup.size)errors.push('עובד מופיע פעמיים באותו תפקיד: '+[...dup].join(', '));
  if(strict&&errors.length)throw new Error(errors.join('\n'));
  return {workers:out,errors};
}

function calculate(){
  const totalTip = floorMoney(document.getElementById('totalTip').value || 0);
  const date = document.getElementById('workDate').value || todayISO();
  const isWeekend = document.getElementById('isWeekend').checked;
  const enableBarCut = document.getElementById('enableBarCut').checked;
  const barPct = enableBarCut ? (isWeekend ? BAR_WEEKEND : BAR_WEEK) : 0;
  // Collect workers for each role
  const barData = getShiftWorkers('bar', false);
  const waiterData = getShiftWorkers('waiter', false);
  const hostData = getShiftWorkers('host', false);
  const managerData = getShiftWorkers('manager', false);
  const errors = [...barData.errors, ...waiterData.errors, ...hostData.errors, ...managerData.errors];
  const waiters = waiterData.workers;
  const bars = barData.workers;
  const hosts = hostData.workers;
  const managers = managerData.workers;
  const waiterHours = waiters.reduce((s, w) => s + w.hours, 0);
  if (totalTip <= 0) errors.push('חסר סה״כ טיפים');
  // Require at least one waiter for distribution; hosts/managers do not count for this validation
  if (waiters.length === 0) errors.push('חסר לפחות מלצר אחד');
  if (enableBarCut && bars.length === 0) errors.push('הפרשה לבר פעילה אבל אין ברמן במשמרת');
  if (errors.length) return { ok: false, errors };
  const barTip = floorMoney(totalTip * barPct);
  const remaining = totalTip - barTip;
  // Determine restaurant percentage based on hourly pay after restaurant cut
  let restPct = 0.15;
  const avgWith = p => (remaining * (1 - p)) / waiterHours;
  if (avgWith(0.20) >= 100) restPct = 0.20;
  else if (avgWith(0.17) >= 90) restPct = 0.17;
  const restCut = floorMoney(remaining * restPct);
  const finalForWaiters = floorMoney(remaining - restCut);
  // Compute pays for waiters
  const effWaiters = waiters.reduce((s, w) => s + w.hours * w.stars, 0);
  const perWaiter = effWaiters ? finalForWaiters / effWaiters : 0;
  const waiterRows = waiters.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perWaiter), rate: w.hours ? floorMoney((w.hours * w.stars * perWaiter) / w.hours) : 0 }));
  // Compute pays for bartenders
  const effBar = bars.reduce((s, w) => s + w.hours * w.stars, 0);
  const perBar = effBar ? barTip / effBar : 0;
  const barRows = bars.map(w => ({ ...w, pay: floorMoney(w.hours * w.stars * perBar), rate: w.hours ? floorMoney((w.hours * w.stars * perBar) / w.hours) : 0 }));
  // Hosts and managers do not receive tips; assign zero pay and rate
  const hostRows = hosts.map(w => ({ ...w, pay: 0, rate: 0 }));
  const managerRows = managers.map(w => ({ ...w, pay: 0, rate: 0 }));
  const avgHourly = waiterHours ? finalForWaiters / waiterHours : 0;
  return {
    ok: true,
    date,
    totalTip,
    isWeekend,
    enableBarCut,
    barPct,
    barTip,
    restPct,
    restCut,
    finalForWaiters,
    avgHourly: floorMoney(avgHourly),
    waiterHours: roundMoney(waiterHours),
    barHours: roundMoney(bars.reduce((s, w) => s + w.hours, 0)),
    hostHours: roundMoney(hosts.reduce((s, w) => s + w.hours, 0)),
    managerHours: roundMoney(managers.reduce((s, w) => s + w.hours, 0)),
    waiters: waiterRows.sort((a, b) => b.pay - a.pay),
    bars: barRows.sort((a, b) => b.pay - a.pay),
    hosts: hostRows.sort((a, b) => b.hours - a.hours),
    managers: managerRows.sort((a, b) => b.hours - a.hours)
  };
}
function calculateAndRender(scroll=false){const calc=calculate();if(!calc.ok){renderReportValidation();setReportStatus('בדיקה נכשלה','err');toast(calc.errors[0]);return null}lastCalculation=calc;renderResults(calc);renderReportValidation(calc);setReportStatus('חושב','ok');if(scroll)document.getElementById('calcResults').scrollIntoView({behavior:'smooth',block:'start'});return calc}
function renderResults(c){
  // Show results container (sticky summary removed to avoid duplication)
  document.getElementById('calcResults').classList.remove('hidden');
  // Build macro KPI grid in requested order: total tip, bar cut, restaurant cut, net waiters, average hourly, then hours per role
  document.getElementById('resultsMacro').innerHTML = `

    <div class="kpi"><span>טיפים לברמנים</span><b>${fmt(c.barTip)} (${Math.round(c.barPct * 100)}%)</b></div>
    <div class="kpi"><span>הפרשה למסעדה</span><b>${fmt(c.restCut)} (${Math.round(c.restPct * 100)}%)</b></div>
    <div class="kpi"><span>טיפים למלצרים</span><b>${fmt(c.finalForWaiters)}</b></div>
    <div class="kpi"><span>ממוצע שעתי מלצרים</span><b>${fmt(c.avgHourly)}</b></div>
    <div class="kpi"><span>שעות מלצרים</span><b>${c.waiterHours}</b></div>

  document.getElementById('hostBody').classList.add('collapsed');

function renderResultCards(rows, avg){
  if (!rows.length) return '<div class="empty">אין נתונים.</div>';
  return `<table class="result-table"><thead><tr><th>שם</th><th>שעות</th><th>כוכבים</th><th>ש״ש</th><th>סכום</th></tr></thead><tbody>${rows.map(r=>{
    const showStars = !(r.role === 'host' || r.role === 'manager');
    const cls = avg > 0 ? (r.rate >= avg * 1.10 ? 'outlier-high' : (r.rate <= avg * 0.90 ? 'outlier-low' : '')) : '';
    return `<tr class="${cls}"><td>${escapeHTML(r.name)}${r.empId?` <span class="muted-cell">${escapeHTML(r.empId)}</span>`:''}</td><td>${roundMoney(r.hours)}</td><td>${showStars?r.stars:'-'}</td><td>${fmt(r.rate)}</td><td class="money">${fmt(r.pay)}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function buildDayRecord(calc,idOverride=null,copyNo=0,shift='evening'){
  const normalizedShift=normalizeShift(shift);
  const notes=document.getElementById('shiftNotes')?.value?.trim()||'';
  return {id:idOverride||cryptoId(),date:calc.date,shift:normalizedShift,copyNo,locked:true,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),editCount:0,notes,totalTip:calc.totalTip,isWeekend:calc.isWeekend,enableBarCut:calc.enableBarCut,barPct:calc.barPct,barTip:calc.barTip,restPct:calc.restPct,restCut:calc.restCut,finalForWaiters:calc.finalForWaiters,avgHourly:calc.avgHourly,waiterHours:calc.waiterHours,barHours:calc.barHours,hostHours:calc.hostHours,managerHours:calc.managerHours,workers:[...calc.waiters.map(w=>({...w,role:'waiter'})),...calc.bars.map(w=>({...w,role:'bar'})),...calc.hosts.map(w=>({...w,role:'host'})),...calc.managers.map(w=>({...w,role:'manager'}))]}
}
function resolveDuplicateDaySave(calc,shift){
  const normalizedShift=normalizeShift(shift);
  const existing=days.find(d=>d.date===calc.date&&normalizeShift(d.shift)===normalizedShift&&d.id!==loadedDayId);
  if(!existing)return {id:loadedDayId,copyNo:0};
  if(confirm(`כבר קיימת משמרת ${shiftText(normalizedShift)} לתאריך הזה. להחליף אותה?`))return {id:existing.id,copyNo:existing.copyNo||0};
  if(confirm('לשמור כעותק נוסף במקום להחליף?'))return {id:loadedDayId,copyNo:days.filter(d=>d.date===calc.date&&normalizeShift(d.shift)===normalizedShift).length};
  toast('השמירה בוטלה');
  return null;
}
async function saveDay(){
  reportValidationVisible=true;
  const calc=calculateAndRender(false);
  if(!calc)return;
  const validation=renderReportValidation(calc,true);
  if(validation&&!validation.ok){setReportStatus('בדיקה נכשלה','err');toast('יש שגיאות בדוח לפני שמירה');return}
  const month=monthOfDate(calc.date);
  if(isMonthClosed(month)){toast('החודש סגור לעריכה');return}
  const shift=getSelectedShift();
  const duplicateChoice=resolveDuplicateDaySave(calc,shift);
  if(!duplicateChoice)return;
  const id=duplicateChoice.id;
  const copyNo=duplicateChoice.copyNo;
  const old=id?days.find(d=>d.id===id):null;
  const record=buildDayRecord(calc,id,copyNo,shift);
  if(old){record.createdAt=old.createdAt;record.editCount=(old.editCount||0)+1;days=days.map(d=>d.id===id?record:d)}else{days.push(record)}
  days.sort((a,b)=>String(a.date).localeCompare(String(b.date))||shiftSortValue(a.shift)-shiftSortValue(b.shift)||(a.copyNo||0)-(b.copyNo||0));
  persist();loadedDayId=record.id;lastCalculation=calc;renderDays();renderMonth();updateEditStatus();checkExistingShift();
  setReportStatus('שומר בענן','warn');
  const ok=await saveCloudNow();
  setReportStatus(ok?'מסונכרן בענן':'נשמר מקומית',ok?'ok':'warn');
  toast(ok?`דוח ${shiftText(record.shift)} נשמר וסונכרן`:'הדוח נשמר מקומית — יש בעיית סנכרון');
}

function dayMatchesSearch(d,q){

function renderDays(){
  const target=document.getElementById('daysList');

  [...filtered].sort((a,b)=>String(b.date).localeCompare(String(a.date))||shiftSortValue(a.shift)-shiftSortValue(b.shift)||(a.copyNo||0)-(b.copyNo||0)).forEach(d=>{

function renderMonthRoleSummary(md){
  const target=document.getElementById('monthRoleSummary');
  if(!target)return;
  const roles=[['waiter','מלצרים'],['bar','ברמנים'],['host','מארחות'],['manager','אחמ״ש']];

function makeMonthMacro(md){return md.reduce((a,d)=>({days:a.days+1,totalTip:a.totalTip+Number(d.totalTip||0),finalForWaiters:a.finalForWaiters+Number(d.finalForWaiters||0),barTip:a.barTip+Number(d.barTip||0),restCut:a.restCut+Number(d.restCut||0),waiterHours:a.waiterHours+Number(d.waiterHours||0),barHours:a.barHours+Number(d.barHours||0),hostHours:a.hostHours+Number(d.hostHours??(d.workers||[]).filter(w=>w.role==='host').reduce((s,w)=>s+Number(w.hours||0),0)),managerHours:a.managerHours+Number(d.managerHours??(d.workers||[]).filter(w=>w.role==='manager').reduce((s,w)=>s+Number(w.hours||0),0))}),{days:0,totalTip:0,finalForWaiters:0,barTip:0,restCut:0,waiterHours:0,barHours:0,hostHours:0,managerHours:0})}
function monthWorkerSummary(md,role='all'){const map=new Map();md.forEach(d=>(d.workers||[]).forEach(w=>{if(role!=='all'&&w.role!==role)return;const key=(w.empUid||w.empId||w.nameSnapshot||w.name)+'|'+w.role;if(!map.has(key)){const emp=getEmployeeByKey(w.empUid)||getEmployeeById(w.empId);map.set(key,{empUid:w.empUid||'',empId:w.empId||'',name:emp?.name||w.nameSnapshot||w.name,role:w.role,hours:0,pay:0,days:new Set()})}const item=map.get(key);item.hours+=Number(w.hours||0);item.pay+=Number(w.pay||0);item.days.add(`${d.date}|${normalizeShift(d.shift)}`)}));return [...map.values()]}
function renderAlerts(md){const alerts=buildAlerts(md);document.getElementById('monthAlerts').innerHTML=alerts.length?`<div class="divider"></div><h3>בדיקת חודש</h3>${alerts.map(a=>`<div class="alert-card"><b class="${a.level==='err'?'danger-text':'warn-text'}">${escapeHTML(a.title)}</b><div class="muted">${escapeHTML(a.detail)}</div></div>`).join('')}`:'<div class="alert-card"><b class="ok-text">לא נמצאו חריגות משמעותיות</b></div>'}
function buildAlerts(md,month=''){
  const alerts=[];
  const byDate={};
  if(!md.length){
    alerts.push({level:'err',title:'אין ימים שמורים בחודש',detail:month||'החודש הנבחר'});
    return alerts;
  }
  md.forEach(d=>{
    const dateShiftKey=`${d.date}|${normalizeShift(d.shift)}`;
    byDate[dateShiftKey]=(byDate[dateShiftKey]||0)+1;
    // No tip total on this day
    if(!d.totalTip) alerts.push({level:'err',title:'משמרת עם 0 טיפים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing waiters on this day
    if(!(d.workers||[]).some(w=>w.role==='waiter')) alerts.push({level:'err',title:'משמרת ללא מלצרים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Missing bartenders on this day
    if(!(d.workers||[]).some(w=>w.role==='bar')) alerts.push({level:'warn',title:'משמרת ללא ברמנים',detail:`${d.date} · ${shiftText(d.shift)}`});
    // Hourly rate out of reasonable range
    if(d.avgHourly>180 || d.avgHourly<30) alerts.push({level:'warn',title:'ש״ש חריג',detail:`${d.date} · ${shiftText(d.shift)} · ${fmt(d.avgHourly)}`});
    // Check each worker
    (d.workers||[]).forEach(w=>{
      // Employee ID is optional; do not alert on missing employee ID
      // Only alert for zero hours
      if(!w.hours) alerts.push({level:'warn',title:'עובד עם 0 שעות',detail:`${d.date} · ${shiftText(d.shift)} · ${w.name}`});
    });
  });
  // Look for duplicate dates
  Object.entries(byDate).forEach(([key,count])=>{
    if(count>1){const [date,shift]=key.split('|');alerts.push({level:'err',title:'כפילות משמרת',detail:`${date} · ${shiftText(shift)} · ${count} רשומות`});}
  });
  return alerts;
}
function toggleMonthClosed(){const m=document.getElementById('monthPicker').value||monthISO();if(isMonthClosed(m)){if(!confirm('לפתוח את החודש לעריכה?'))return;closedMonths=closedMonths.filter(x=>x.month!==m);toast('החודש נפתח לעריכה')}else{const alerts=buildAlerts(currentMonthDays(),m);if(alerts.some(a=>a.level==='err')&&!confirm('יש חריגות חמורות. לסגור בכל זאת?'))return;closedMonths.push({month:m,closedAt:new Date().toISOString()});toast('החודש נסגר')}persist();renderMonth()}

function toCsv(rows){return rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')}

      var qa=document.createElement('div');
      qa.className='quick-actions-v19';
      qa.innerHTML='<h2>פעולות מהירות</h2><div class="quick-grid-v19"><button type="button" class="quick-btn-v19" onclick="saveDay()"><span>▣</span>סגירת יום</button><button type="button" class="quick-btn-v19" onclick="showView(\'monthView\')"><span>▥</span>דוחות</button><button type="button" class="quick-btn-v19" onclick="showView(\'employeesView\')"><span>👥</span>עובדים</button><button type="button" class="quick-btn-v19" onclick="showView(\'journalView\')"><span>⇄</span>היסטוריה</button></div>';
      if(staff && staff.parentNode) staff.parentNode.insertBefore(qa, staff.nextSibling);
    }
    var tabs=[...document.querySelectorAll('.tab-btn')];
    tabs.forEach(function(b){
      if(b.dataset.view==='calcView') b.textContent='אונליין';
      if(b.dataset.view==='employeesView') b.textContent='עובדים';
      if(b.dataset.view==='journalView') b.textContent='התראות';
      if(b.dataset.view==='monthView') b.textContent='דוחות';
    });
    var copyBtns=[...document.querySelectorAll('button')].filter(b=>/משמרת קודמת|העתק ממשמרת/.test(b.textContent||''));
    copyBtns.forEach(b=>b.textContent='משמרת חדשה');
    function setActiveShift(){
      var shift=(document.querySelector('.shift-choice.active')||{}).textContent||'';
      document.body.dataset.activeShift=shift.includes('בוקר')?'morning':'evening';
    }
    document.addEventListener('click',function(e){ if(e.target.closest('.shift-choice')) setTimeout(setActiveShift,0); });
    setActiveShift();
  });
})();
</script>


<script>
(function(){
  function polishShell(){
    document.documentElement.setAttribute('data-ui-version','v20-base44-grade');
    const tips = document.querySelector('.tips-card');
    const report = document.querySelector('.report-card');
    if(tips && report && report.nextElementSibling !== tips){
      report.insertAdjacentElement('afterend', tips);
    }
    const h1 = document.querySelector('.topbar h1');
    if(h1 && h1.textContent.trim() !== 'הצדף'){
      h1.textContent = 'הצדף';
    }
    document.querySelectorAll('.department-title .btn').forEach(btn => {
      if(btn.textContent.trim() === 'פתח/סגור') btn.textContent = 'עוד';
    });
    const prevBtn = document.querySelector('.report-actions .btn');
    if(prevBtn && /משמרת קודמת|העתק/.test(prevBtn.textContent)) prevBtn.textContent = 'ייבוא צוות';
    const calc = document.querySelector('#shiftFab .btn:first-child');
    if(calc) calc.textContent = 'חשב';
    const save = document.querySelector('#shiftFab .btn.secondary');
    if(save) save.textContent = 'שמור';
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', polishShell);
  else polishShell();
})();
</script>
